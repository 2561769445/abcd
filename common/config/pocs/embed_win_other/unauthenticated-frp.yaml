id: unauthenticated-frp

info:
  name: FRPS Dashboard - Detect
  author: pikpikcu
  severity: info
  description: FRPS Dashboard panel was detected.
  tags: frp,unauth,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>frps dashboard</title>"
        part: body

      - type: status
        status:
          - 200

