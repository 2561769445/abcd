id: sonarqube-projects-disclosure

info:
  name: SonarQube - Information Disclosure
  author: DhiyaneshDk
  severity: medium
  tags: sonarqube,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/components/search_projects"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"visibility":"public"'
          - '{"organization'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

