id: headless-remote-api-unauth

info:
  name: Headless Unauth
  author: carrypan
  severity: low
  description: Sensitive environment variables may not be masked
  metadata:
    max-request: 4
  tags: misconfig,headless,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/json/version"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl: 
          - 'contains(body, "\"Protocol-Version\"")'
          - 'status_code == 200'
          - '!contains(body, "<")'
        condition: and

