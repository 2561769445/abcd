    extractors:
      - type: regex
        name: sessionID
        part: body
        internal: true  # 标记为内部提取器，仅用于后续请求
        regex:
          - "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"  # 匹配 UUID 格式的 SessionID

    # 正确的matchers配置（无报错）
    matchers:
      - type: dsl
        dsl:
          - 'status_code_3 == 200'  # 匹配第三个请求的响应状态码为200
          - 'contains(body_3, "SQLite format")'
        condition: and