id: finereport-v10-channel-deserialization

info:
  name: 帆软报表 channel反序列化漏洞
  author: finereport
  severity: critical
  tags: finereport

http:
  - raw:
      - |
        GET /decision/remote/design/channel HTTP/1.1
        Content-Type: application/json
        Host: {{Hostname}}

      - |
        POST /decision/remote/design/channel HTTP/1.1
        Content-Type: application/json
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && contains(body_1,"document.getElementById") && contains(body_1,"/webroot/decision")
          - status_code_2 == 200 && !contains(body_2,"/webroot/decision")
        condition: and
