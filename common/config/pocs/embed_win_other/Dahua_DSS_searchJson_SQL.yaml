id: Dahua_DSS_searchJson_SQL

info:
  name: Dahua_DSS_searchJson_SQL
  author: pitaya
  severity: high
  description: 大华DSS数字监控系统searchJson存在SQL注入漏洞，未经身份验证的攻击者可通过该漏洞获取数据库敏感信息。

http:
