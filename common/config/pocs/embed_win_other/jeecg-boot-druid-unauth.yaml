id: jeecg-boot-druid-unauth

info:
  name: Jeecg-Boot Druid 未授权访问
  author: SleepingBag945
  severity: medium
  tags: jeecg

http:
  - raw:
      - |
        GET /webpage/system/druid/index.html HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Druid Stat Index")'
          - 'contains(body, "DruidVersion")'
        condition: and

