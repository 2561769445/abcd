id: nacos-jraftserver-deserialization-rce

info:
  name: Nacos - jraftserver deserialization Remote Code Execution
  author: unknown
  severity: critical
  tags: nacos
  metadata:
    max-request: 1

http:
  - method: GET
    path:
      - "{{RootURL}}/nacos/v1/console/server/state"
      - "{{RootURL}}/v1/console/server/state"
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "\"standalone_mode\":\"cluster\"")'
          - 'contains("\"version\":\"2")'
