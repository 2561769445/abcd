id: OpenMetadata-login-Weak-password

info:
  name: OpenMetadata login 弱口令漏洞
  author: OpenMetadata
  severity: high
  tags: Weak password

http:
  - raw:
      - |
        POST /api/v1/users/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"email":"admin@open-metadata.org","password":"YWRtaW4="}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"accessToken":'
          - '"refreshToken":'
        condition: and
      - type: status
        status: 
        - 200