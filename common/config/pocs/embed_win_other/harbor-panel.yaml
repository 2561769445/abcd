id: harbor-panel

info:
  name: Harbor Login Panel - Detect
  author: daffainfo
  severity: info
  tags: panel,harbor

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Harbor</title>"
          - "<harbor-app>"
        condition: and

      - type: status
        status:
          - 200

