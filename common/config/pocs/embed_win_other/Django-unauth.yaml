id: Django-unauth

info:
  name: Django Unauth
  author: carrypan
  severity: low
  description: Sensitive environment variables may not be masked
  metadata:
    max-request: 4
  tags: misconfig,Django,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/lljfafd"
      - "{{BaseURL}}/api/lljfafd"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl: 
          - 'contains(body, "<title>Page not found at") && contains(body,"lljfafd</title>")'
          - 'status_code != 404'
        condition: and

