id: FineReport

info:
  name: FineReport
  author: carrypan
  severity: info
  description: Sensitive environment variables may not be masked
  metadata:
    max-request: 4
  tags: misconfig,FineReport,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/webroot/ReportServer?op=resource&resource=/com/fr/web/jquery.js"
      - "{{BaseURL}}/WebReport/ReportServer?op=resource&resource=/com/fr/web/jquery.js"
      - "{{BaseURL}}/seeyonreport/ReportServer?op=resource&resource=/com/fr/web/jquery.js"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl: 
          - 'contains(body, "jQuery=") && !contains(body, "<title>")'
        condition: and

