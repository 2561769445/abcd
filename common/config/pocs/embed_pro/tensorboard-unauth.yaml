id: tensorboard-unauth

info:
  name: Tensorboard Unauth
  author: xc
  severity: high
  description: |-
    Tensorboard 未授权访问

http:
  - raw:
      - |
        GET /data/plugins_listing HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "\"profile\":"
        part: body
      - type: word
        words:
          - "\"distributions\":"
        part: body