id: akamai-detect

info:
  name: akamai cdn detection
  author: xc
  severity: info
  metadata:
    max-request: 1
  tags: akamai,cdn,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Pragma: akamai-x-cache-on
    matchers:
      - type: word
        part: x_cache
        words:
          - "deploy.akamai"

